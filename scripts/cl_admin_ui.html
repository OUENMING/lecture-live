<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通行码管理</title>
<style>
/* ---------------------------------------------------------------
   设计口径（2026-10-14，参考 Geist/Vercel 的克制外壳 + IBM Carbon
   的数据色阶）：
     · 外壳全灰阶。颜色**只**出现在数据与状态上，且状态只用 10px 的点。
     · 4px 底数；字号只有 11/12/13/15/28；字重只有 400/500/600（不用 700）。
     · 容器边界一律 box-shadow 而不是 border（不动盒模型）。
     · 大数字用等宽 + tabular-nums + 负字距。
     · 圆角只有两档：6px（控件）/ 12px（卡片）。
     · 数据色：浅色 Carbon 60 步、深色 Carbon 50/60 步。2026-10-14 跑过 dataviz 的
       validate_palette.js：深色原来那组 40/30 步**全部超出亮度带**（L>0.67，在深底上发白），换成现在这组后六项全过。
       浅色 #ff832b 对白底只有 2.46:1 —— 它只出现在带数字标注的地方（有文字兜底）。
   ⚠️ 零外链：断网也要能用，所以不引字体、不引图表库。
   --------------------------------------------------------------- */
:root{
  --bg:#fafafa; --surface:#fff; --recessed:#f2f2f2;
  --ink:#171717; --ink2:#4d4d4d; --ink3:#8f8f8f;
  --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.055);
  --accent:#0072f5; --focus:#005fcc;
  --ok:#198038; --warn:#b25000; --bad:#d92d20;
  --d1:#0f62fe; --d2:#009d9a; --d3:#8a3ffc; --d4:#ff832b;
  --fill:rgba(15,98,254,.10);
  --ring:0 0 0 1px var(--line);
  --ring2:0 0 0 1px var(--line2);
  --lift:0 0 0 1px rgba(0,0,0,.09), 0 2px 2px rgba(0,0,0,.03);
  --r:6px; --rc:12px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme=dark]{
  --bg:#0a0a0a; --surface:#131313; --recessed:#1c1c1c;
  --ink:#ededed; --ink2:#a1a1a1; --ink3:#6e6e6e;
  --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.06);
  --accent:#3291ff; --focus:#78a9ff;
  --ok:#42be65; --warn:#ffb784; --bad:#ff8389;
  --d1:#4589ff; --d2:#009d9a; --d3:#a56eff; --d4:#eb6200;
  --fill:rgba(69,137,255,.16);
  --lift:0 0 0 1px rgba(255,255,255,.11), 0 2px 2px rgba(0,0,0,.3);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0a0a0a; --surface:#131313; --recessed:#1c1c1c;
  --ink:#ededed; --ink2:#a1a1a1; --ink3:#6e6e6e;
  --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.06);
  --accent:#3291ff; --focus:#78a9ff;
  --ok:#42be65; --warn:#ffb784; --bad:#ff8389;
  --d1:#4589ff; --d2:#009d9a; --d3:#a56eff; --d4:#eb6200;
  --fill:rgba(69,137,255,.16);
  --lift:0 0 0 1px rgba(255,255,255,.11), 0 2px 2px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface);border:0;border-radius:var(--r);padding:5px 11px;
  box-shadow:var(--ring);transition:background-color .12s ease,color .12s ease,box-shadow .12s ease}
button:hover{background:var(--recessed)}
button:active{box-shadow:var(--ring2)}
button.primary{background:var(--ink);color:var(--bg);font-weight:500}
button.primary:hover{background:var(--ink2)}
button.danger{color:var(--bad)}
button.danger:hover{background:var(--bad);color:#fff;box-shadow:none}
button:focus-visible,input:focus-visible,tr.body:focus-visible{outline:0;
  box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--focus)}
button[disabled]{opacity:.4;cursor:not-allowed}
input{background:var(--surface);border:0;border-radius:var(--r);padding:6px 9px;width:100%;box-shadow:var(--ring)}
input:focus{outline:0;box-shadow:var(--ring),0 0 0 3px var(--fill)}
label{display:block;font-size:11px;color:var(--ink3);margin-bottom:4px}

.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;
  background:var(--bg);box-shadow:0 1px 0 0 var(--line)}
.brand{font-weight:600;letter-spacing:-.01em}
.spacer{flex:1}
.seg{display:flex;background:var(--recessed);border-radius:var(--r);padding:2px;gap:2px}
.seg button{background:transparent;box-shadow:none;padding:4px 11px;font-size:12px;color:var(--ink2);border-radius:4px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--ring2)}

main{max-width:1280px;margin:0 auto;padding:24px}
.block{margin-bottom:32px}
.hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.hd h2{margin:0;font-size:13px;font-weight:600}
.hd .note{font-size:11px;color:var(--ink3)}
.hd .spacer{flex:1}

/* ---- KPI 卡：Geist 的 14/28/12 三行式，padding 16 ---- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:var(--rc);padding:16px;box-shadow:var(--ring2)}
.kpi .k{font-size:12px;color:var(--ink2)}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:28px;font-weight:600;
  letter-spacing:-1.1px;line-height:1.15;margin:6px 0 2px}
.kpi .v small{font-size:14px;font-weight:500;letter-spacing:0;color:var(--ink2);margin-left:3px}
.kpi .s{font-size:11px;color:var(--ink3);min-height:16px}
.kpi .sp{margin-top:10px;height:28px}

/* ---- 两张图并排 ---- */
.charts{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;font-size:10.5px;line-height:16px;color:var(--ink3);box-shadow:var(--ring2);vertical-align:1px}
.card{background:var(--surface);border-radius:var(--rc);padding:16px;box-shadow:var(--ring2)}
.card .ch{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.card .ch h3{margin:0;font-size:12px;font-weight:600;color:var(--ink2)}
.card .ch .spacer{flex:1}
.card .ch .note{font-size:11px;color:var(--ink3)}
.chartwrap{width:100%;position:relative}
.chartwrap svg{display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:11px;
  font-family:var(--mono);font-variant-numeric:tabular-nums;padding:3px 7px;border-radius:4px;white-space:nowrap;
  opacity:0;transition:opacity .1s ease;z-index:5;transform:translate(-50%,-100%)}
.tip.on{opacity:1}

/* ---- 额度条 ---- */
.mtrack{height:6px;background:var(--recessed);border-radius:3px;overflow:hidden;display:flex}
.mtrack i{display:block;height:100%;border-radius:3px}

/* ---- 表 ---- */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 10px 7px 0;white-space:nowrap;box-shadow:0 1px 0 0 var(--line2)}
th{font-size:11px;font-weight:500;color:var(--ink3);box-shadow:0 1px 0 0 var(--line)}
td.r,th.r{text-align:right}
th.sp,td.sp{width:100%;min-width:90px;padding-right:18px}
td.sp .chartwrap{max-width:220px}
tr.body{cursor:pointer}
tr.body:hover td{background:var(--recessed)}
tr.body[aria-expanded=true] td{background:var(--recessed)}
.chev{display:inline-block;width:9px;color:var(--ink3);transition:transform .12s ease}
tr[aria-expanded=true] .chev{transform:rotate(90deg)}
.mono{font-size:12px;font-variant-numeric:tabular-nums}
.dim{color:var(--ink2)}
.faint{color:var(--ink3)}
.dotm{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.dotm i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .mut{color:var(--ink3)}

/* ---- 展开行 ---- */
tr.detail>td{background:var(--recessed);padding:16px 16px 18px 18px;white-space:normal;box-shadow:none}
.dtop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 20px;margin-bottom:16px}
.dtop div{font-size:11px;color:var(--ink3)}
.dtop b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;color:var(--ink)}
.dsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-bottom:16px}
.dtitle{font-size:11px;color:var(--ink3);margin-bottom:7px}
.acts{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.acts .fld{width:118px}
.acts .fld button{width:100%}
.hint{font-size:11px;color:var(--ink3);margin-top:9px}
.code{font-family:var(--mono);font-size:13px;font-weight:500;user-select:all;cursor:text}

/* ---- 状态覆盖 ---- */
.banner{background:var(--surface);border-radius:var(--r);padding:10px 12px;margin-bottom:16px;
  box-shadow:var(--ring2),inset 3px 0 0 0 var(--bad);display:flex;gap:10px;align-items:flex-start}
.banner b{color:var(--bad);font-weight:600}
.banner button{margin-left:auto;box-shadow:none;background:transparent;color:var(--ink3);padding:0 4px}
.empty{color:var(--ink2);padding:28px 0;font-size:13px}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px;font-size:14px}
.skel{background:var(--recessed);border-radius:4px;height:12px;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.prog{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:30;transition:width .25s ease}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .prog{display:none}
}
.foot{color:var(--ink3);font-size:11px;padding:0 0 40px}
.qgrid{display:grid;grid-template-columns:88px repeat(3,minmax(0,1fr));gap:6px 18px;align-items:center;
  padding:11px 0;box-shadow:0 1px 0 0 var(--line2)}
.qgrid:last-of-type{box-shadow:none}
.qgrid .name{font-weight:500}
.qcell .t{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-bottom:4px}
.qcell .t b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink2)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink3);margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
details.prices>summary{cursor:pointer;font-size:13px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:baseline}
details.prices>summary::-webkit-details-marker{display:none}
details.prices>summary .note{font-size:11px;color:var(--ink3);font-weight:400}
details.prices[open]>summary{margin-bottom:12px}
.toggle{background:transparent;box-shadow:none;color:var(--ink3);font-size:12px;padding:6px 0}
.toggle:hover{background:transparent;color:var(--ink)}
@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .charts{grid-template-columns:minmax(0,1fr)}
  .dsplit{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="prog" id="prog"></div>

<header class="bar">
  <span class="brand">通行码管理</span>
  <div class="seg" id="range" role="group" aria-label="时间区间">
    <button data-days="1">今天</button>
    <button data-days="7" aria-pressed="true">7 天</button>
    <button data-days="30">30 天</button>
  </div>
  <span class="spacer"></span>
  <div class="seg" id="theme" role="group" aria-label="主题">
    <button data-theme="auto" aria-pressed="true">自动</button>
    <button data-theme="light">浅</button>
    <button data-theme="dark">深</button>
  </div>
  <span class="note" id="fresh" title="每 60 秒自动刷新一次（标签页在前台、没在填表时）"></span>
  <button id="refresh">刷新</button>
</header>

<main>
  <div id="err"></div>

  <section class="block">
    <div class="kpis" id="kpis"></div>
  </section>

  <section class="block">
    <div class="charts">
      <div class="card">
        <div class="ch">
          <h3>每日用量</h3><span class="note">按 UTC 日 · 浅色柱 = 今天还没过完</span>
          <span class="spacer"></span>
          <div class="seg" id="metric" role="group" aria-label="指标">
            <button data-m="asr" aria-pressed="true">转写分钟</button>
            <button data-m="llm">翻译次数</button>
            <button data-m="tin">输入 token</button>
            <button data-m="tout">输出 token</button>
          </div>
        </div>
        <div id="daily"></div>
      </div>
      <div class="card">
        <div class="ch"><h3>每人用量</h3><span class="spacer"></span><span class="note" id="pernote"></span></div>
        <div id="peruser"></div>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="hd"><h2>系统额度</h2><span class="note" id="qnote"></span><span class="spacer"></span>
      <span class="note">到 95% 自动降级，不等对方回 429</span></div>
    <div class="card" id="quota"></div>
  </section>

  <section class="block">
    <div class="hd"><h2>Cloudflare</h2><span class="note" id="cfnote"></span><span class="spacer"></span>
      <span class="note">本机用只读 token 直接问 Cloudflare，不经 Worker</span></div>
    <div class="card" id="cf"></div>
  </section>

  <section class="block">
    <div class="hd"><h2>用户</h2><span class="note" id="unote"></span><span class="spacer"></span>
      <button class="primary" id="addbtn">发新码</button></div>
    <div id="addform" hidden></div>
    <div id="users"></div>
  </section>

  <section class="block">
    <details class="prices">
      <summary>价目表 <span class="note">花费是本机按这张表乘出来的，不是账 · 点开改价</span></summary>
      <div class="card" id="prices"></div>
    </details>
  </section>

  <p class="foot">数据来自 asr.bldcam.page（Worker 的 /v1/admin/*）。面板只记数字：看不到任何课堂文本与音频。</p>
</main>

<script>
/* >>>CLUI-COST-START<<< */
/* 判据从这两个哨兵之间抠出源码，喂给 node 跑（tests/test_cl_admin_ui.py）。
   改这里不用改测试。但要保持它是纯函数：不读 state、不碰 DOM，价目表整个从参数进来。 */
function cluiCost(u, p){
  var hit = Math.min(u.cache_hit || 0, u.tokens_in || 0), miss = Math.max(0, (u.tokens_in || 0) - hit);
  return (hit * p.cache + miss * p.miss + (u.tokens_out || 0) * p.out) / 1e6;
}
/* >>>CLUI-COST-END<<< */

(function(){
"use strict";
var GATE = {"X-ClassLive-Admin":"1"};
var NS = "http://www.w3.org/2000/svg";
var HINT = "续期是「从现在起再加 N 天」。限额留空 = 不限，改动立刻生效。转写秒按每次请求至少 10 秒计。";
var METRICS = {
  asr:  {label:"转写分钟", unit:"分", color:"var(--d1)", pick:function(u){ return u.asr_s/60; }},
  llm:  {label:"翻译次数", unit:"次", color:"var(--d2)", pick:function(u){ return u.llm_reqs; }},
  tin:  {label:"输入 token", unit:"tok", color:"var(--d3)", pick:function(u){ return u.tokens_in; }},
  tout: {label:"输出 token", unit:"tok", color:"var(--d4)", pick:function(u){ return u.tokens_out; }}
};
var state = {
  days: 7, theme: "auto", metric: "asr",
  codes: [], days_data: [], quota: null, limit: null,
  expanded: null, showRevoked: false, busy: false, loaded: false, err: null,
  minCache: {}, minDay: {},
  prices: JSON.parse(localStorage.getItem("clui-prices") || "null") || {cache:0.003, miss:0.15, out:0.60}
};
var $ = function(s){ return document.querySelector(s); };
function el(t, cls, txt){ var e = document.createElement(t); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
function num(n, d){ if(n == null || isNaN(n)) return "无"; return Number(n).toLocaleString("en-US",{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function mins(sec){ return sec == null ? "无" : (sec/60).toFixed(sec/60 >= 100 ? 0 : 1); }
function hm(ms){ var t = new Date(ms); return String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0"); }
function ago(ms){      /* 本机时区，**永远精确到分钟**：「今天 13:17 / 昨天 22:05 / 10-12 09:06」 */
  if(!ms) return "无";
  var t = new Date(ms), now = new Date();
  var d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if(ms >= d0) return "今天 " + hm(ms);
  if(ms >= d0 - 86400000) return "昨天 " + hm(ms);
  return String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0") + " " + hm(ms);
}
function since(dt){   /* 一段时长 -> 「刚刚 / N 分钟前 / N 小时前 / N 天前」 */
  var m = Math.floor(Math.max(0, dt) / 60000);
  if(m < 1) return "刚刚";
  if(m < 60) return m + " 分钟前";
  if(m < 1440) return Math.floor(m / 60) + " 小时前";
  return Math.floor(m / 1440) + " 天前";
}
function utcToday(){ return new Date().toISOString().slice(0,10); }   /* Worker 的「日」是 UTC 日 */
function ymd(ms){ return ms ? new Date(ms).toISOString().slice(0,10) : "无"; }
function limStr(v){ return v == null ? "" : String(v); }
function limNum(v){ var t = String(v).trim(); if(t === "") return null; var n = Number(t); return (isFinite(n) && n >= 0) ? n : undefined; }
function showHint(node, msg){ node.textContent = msg; node.style.color = "var(--bad)";
  setTimeout(function(){ node.textContent = HINT; node.style.color = ""; }, 3000); }

/* ---------- 聚合 ---------- */
var KEYS = ["asr_s","asr_reqs","llm_reqs","tokens_in","tokens_out","cache_hit","jev_reqs","jev_q"];
function sumRows(rows, code){
  var t = {models:{}, vers:{}};
  KEYS.forEach(function(k){ t[k] = 0; });
  (rows || []).forEach(function(r){
    if(code && r.code !== code) return;
    KEYS.forEach(function(k){ t[k] += (r[k] || 0); });
    var m = r.models || {}, v = r.vers || {};
    Object.keys(m).forEach(function(k){ t.models[k] = (t.models[k]||0) + m[k]; });
    Object.keys(v).forEach(function(k){ t.vers[k] = (t.vers[k]||0) + v[k]; });
  });
  return t;
}
function allRows(){ return state.days_data.reduce(function(a,d){ return a.concat(d.rows); }, []); }
function series(code, pick){
  return state.days_data.map(function(d){ return {day:d.day, v: pick(sumRows(d.rows, code))}; });
}

/* ---------- 客户端 ---------- */
function api(name, body){
  return fetch("/api/" + name, {method:"POST",
    headers: Object.assign({"content-type":"application/json"}, GATE),
    body: JSON.stringify(body || {})})
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; }); });
}
var progT = null;
function progress(on){
  var p = $("#prog");
  if(on){ p.style.width = "38%"; clearTimeout(progT); progT = setTimeout(function(){ p.style.width = "72%"; }, 220); }
  else { p.style.width = "100%"; setTimeout(function(){ p.style.width = "0"; }, 200); }
}

/* ---------- SVG 小工具 ---------- */
function sv(tag, attrs){
  var e = document.createElementNS(NS, tag);
  Object.keys(attrs || {}).forEach(function(k){ e.setAttribute(k, attrs[k]); });
  return e;
}
function svText(x, y, s, opt){
  var t = sv("text", {x:x, y:y, fill:(opt && opt.fill) || "var(--ink3)",
    "font-size":(opt && opt.size) || 10.5, "font-family":"var(--mono)",
    "text-anchor":(opt && opt.anchor) || "middle"});
  t.textContent = s;
  return t;
}
function niceMax(v){
  if(!(v > 0)) return 1;
  var e = Math.pow(10, Math.floor(Math.log10(v))), m = v / e;
  var step = m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10;
  return step * e;
}
function shortNum(v){
  if(v >= 1e6) return (v/1e6).toFixed(v >= 1e7 ? 0 : 1) + "M";
  if(v >= 1e3) return (v/1e3).toFixed(v >= 1e4 ? 0 : 1) + "k";
  return String(Math.round(v * 10) / 10);
}

/* ---------- 图 1：迷你走势（KPI 卡 / 表里那一列） ---------- */
function sparkPath(vals, w, h, pad){
  var max = Math.max.apply(null, vals.concat([0])) || 1, n = vals.length;
  if(n < 2) return "";
  var iw = w - pad*2, ih = h - pad*2, step = iw / (n - 1);
  return vals.map(function(v, i){
    var x = pad + i*step, y = pad + ih - (v/max)*ih;
    return (i ? "L" : "M") + (Math.round(x*10)/10) + " " + (Math.round(y*10)/10);
  }).join(" ");
}
function sparkline(vals, opt){
  opt = opt || {};
  var h = opt.h || 26, pad = 2, fluid = !opt.w, w = fluid ? 300 : opt.w;
  var wrap = el("div","chartwrap"); wrap.style.height = h + "px";
  var attrs = {height:h, "aria-hidden":"true"};
  if(fluid){ attrs.viewBox = "0 0 " + w + " " + h; attrs.preserveAspectRatio = "none"; attrs.style = "width:100%;display:block"; }
  else { attrs.width = w; }
  var s = sv("svg", attrs);
  var d = sparkPath(vals, w, h, pad);
  if(d){
    var last = vals.length - 1, iw = w - pad*2, ih = h - pad*2;
    var max = Math.max.apply(null, vals) || 1;
    var area = d + " L" + (pad + iw) + " " + (h - pad) + " L" + pad + " " + (h - pad) + " Z";
    s.appendChild(sv("path", {d:area, fill:(opt.color || "var(--d1)"), "fill-opacity":.12, stroke:"none"}));
    s.appendChild(sv("path", {d:d, fill:"none", stroke:(opt.color || "var(--d1)"), "stroke-width":1.5,
      "stroke-linejoin":"round", "stroke-linecap":"round",
      "vector-effect": fluid ? "non-scaling-stroke" : "none"}));
    if(!fluid){                                   /* 非等比缩放下圆会变成细条，所以自适应时不画端点 */
      var ly = pad + ih - (vals[last]/max)*ih;
      s.appendChild(sv("circle", {cx:(pad + iw), cy:Math.round(ly*10)/10, r:2, fill:(opt.color || "var(--d1)")}));
    }
  }
  wrap.appendChild(s);
  return wrap;
}

/* ---------- 图 2：每日柱（每日用量），带轴、网格、hover 读数 ----------
   为什么是柱不是折线：每天是一个**离散的总量**，不是连续量；而且「今天」只过了一部分 ——
   折线会把今天画成一次「下跌」。柱可以把今天单独画成浅色（进行中），1 天的区间也画得出来。 */
function colChart(items, meta, today){
  var wrap = el("div","chartwrap");
  var tip = el("div","tip"); wrap.appendChild(tip);
  var lastW = 0, busy = false;
  function draw(){
    var w = Math.round(wrap.clientWidth || 640);
    if(w < 80) return;
    if(Math.abs(w - lastW) < 3 && wrap.querySelector("svg")) return;
    lastW = w;
    var old = wrap.querySelector("svg"); if(old) wrap.removeChild(old);
    var H = 208, padL = 46, padR = 8, padT = 14, padB = 28;
    var iw = w - padL - padR, ih = H - padT - padB;
    var vals = items.map(function(x){ return x.v; });
    var max = niceMax(Math.max.apply(null, vals.concat([0])));
    var s = sv("svg", {width:w, height:H, role:"img",
      "aria-label": meta.label + "：" + items.map(function(x){ return x.day.slice(5) + " " + shortNum(x.v); }).join("，")});
    for(var t = 0; t <= 4; t++){
      var y = padT + ih - (ih * t/4);
      s.appendChild(sv("line", {x1:padL, y1:y, x2:w - padR, y2:y, stroke:"var(--line2)", "stroke-width":1,
        "shape-rendering":"crispEdges"}));
      s.appendChild(svText(padL - 8, y + 3.5, shortNum(max * t/4), {anchor:"end"}));
    }
    var slot = iw / items.length, bw = Math.max(2, Math.min(28, slot - 2));   // 柱间至少 2px 底色缝
    var every = Math.max(1, Math.ceil(items.length / Math.max(2, Math.floor(iw / 58))));
    items.forEach(function(x, i){
      var cx = padL + slot * (i + .5), h = max ? (x.v / max) * ih : 0, y0 = padT + ih;
      var live = x.day === today;
      if(h > 0){
        var r = Math.min(4, bw / 2, h);                 // 只圆顶端，底端贴着基线
        var d = "M" + (cx - bw/2) + " " + y0 + " V" + (y0 - h + r) +
                " Q" + (cx - bw/2) + " " + (y0 - h) + " " + (cx - bw/2 + r) + " " + (y0 - h) +
                " H" + (cx + bw/2 - r) + " Q" + (cx + bw/2) + " " + (y0 - h) + " " + (cx + bw/2) + " " + (y0 - h + r) +
                " V" + y0 + " Z";
        s.appendChild(sv("path", {d:d, fill:meta.color, opacity: live ? .45 : 1}));
      }
      if(!(i % every) || i === items.length - 1)
        s.appendChild(svText(cx, H - 9, live ? "今天" : x.day.slice(5), {}));
      var band = sv("rect", {x: cx - slot/2, y: padT, width: slot, height: ih, fill:"transparent"});
      band.addEventListener("mouseenter", function(){
        tip.textContent = x.day + (live ? "（进行中）" : "") + "  " + num(x.v, x.v >= 100 ? 0 : 1) + " " + meta.unit;
        tip.style.left = Math.max(40, Math.min(w - 40, cx)) + "px";
        tip.style.top = (y0 - h - 8) + "px";
        tip.classList.add("on");
      });
      band.addEventListener("mouseleave", function(){ tip.classList.remove("on"); });
      s.appendChild(band);
    });
    wrap.appendChild(s);
  }
  requestAnimationFrame(draw);
  if(window.ResizeObserver){
    new ResizeObserver(function(){ if(!busy){ busy = true; requestAnimationFrame(function(){ busy = false; draw(); }); } }).observe(wrap);
  }
  return wrap;
}

/* ---------- 图 3：横条排行（每人用量 / 模型 / 版本） ---------- */
function hBars(items, opt){

/* ---------- 图 5：逐分钟（多条泳道共用一根时间轴）----------
   一分钟一根细柱；几条泳道上下排（小多图），不叠在同一根轴上 —— 段数和 token 量纲差几个数量级。
   悬停 = 竖线 + 读数（本机时刻 + 每条泳道那一分钟的值）。`t0` 是第 0 分钟的毫秒时刻，`n` 是分钟数。 */
function minuteChart(lanes, t0, n, opt){
  opt = opt || {};
  var wrap = el("div","chartwrap");
  var tip = el("div","tip"); tip.style.whiteSpace = "pre"; tip.style.textAlign = "left"; wrap.appendChild(tip);
  var lastW = 0, busy = false;
  function draw(){
    var w = Math.round(wrap.clientWidth || 640);
    if(w < 80) return;
    if(Math.abs(w - lastW) < 3 && wrap.querySelector("svg")) return;
    lastW = w;
    var old = wrap.querySelector("svg"); if(old) wrap.removeChild(old);
    var padL = 92, padR = 8, laneH = opt.laneH || 40, gap = 10, axisH = 20;
    var H = lanes.length * (laneH + gap) + axisH, iw = w - padL - padR, step = iw / n;
    var s = sv("svg", {width:w, height:H, role:"img", "aria-label": opt.label || "逐分钟"});
    lanes.forEach(function(L, li){
      var y0 = li * (laneH + gap), keys = Object.keys(L.pts);
      var max = Math.max.apply(null, keys.map(function(k){ return L.pts[k]; }).concat([0])) || 1;
      s.appendChild(sv("rect", {x:padL, y:y0, width:iw, height:laneH, fill:"var(--recessed)", rx:3}));
      s.appendChild(svText(padL - 8, y0 + laneH/2 - 2, L.name, {anchor:"end", fill:"var(--ink2)", size:11}));
      s.appendChild(svText(padL - 8, y0 + laneH/2 + 11, "峰 " + shortNum(max), {anchor:"end", size:9.5}));
      var bw = Math.max(1, step - (step > 3 ? 1 : 0));
      keys.forEach(function(k){
        var v = L.pts[k]; if(!(v > 0)) return;
        var h = Math.max(1.5, v / max * (laneH - 4));
        s.appendChild(sv("rect", {x: padL + (+k) * step, y: y0 + laneH - h, width: bw, height: h, fill: L.color}));
      });
    });
    var yA = lanes.length * (laneH + gap);
    var every = n <= 180 ? 15 : n <= 720 ? 60 : 120;          /* 刻度：本机整点 / 整刻 */
    for(var i = 0; i <= n; i++){
      var tm = t0 + i * 60000, d = new Date(tm);
      if((d.getHours() * 60 + d.getMinutes()) % every) continue;
      var x = padL + i * step;
      s.appendChild(sv("line", {x1:x, y1:0, x2:x, y2:yA - gap, stroke:"var(--line2)", "stroke-width":1, "shape-rendering":"crispEdges"}));
      s.appendChild(svText(x, yA + 12, hm(tm), {}));
    }
    var cross = sv("line", {x1:0, y1:0, x2:0, y2:yA - gap, stroke:"var(--ink2)", "stroke-width":1, opacity:0});
    s.appendChild(cross);
    var hit = sv("rect", {x:padL, y:0, width:iw, height:yA, fill:"transparent"});
    hit.addEventListener("mousemove", function(e){
      var r = s.getBoundingClientRect(), i = Math.floor((e.clientX - r.left - padL) / step);
      if(i < 0 || i >= n){ tip.classList.remove("on"); return; }
      var x = padL + (i + .5) * step;
      cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("opacity", .5);
      var lines = [hm(t0 + i * 60000) + (opt.dateOf ? "  " + opt.dateOf(t0 + i * 60000) : "")];
      lanes.forEach(function(L){ var v = L.pts[i] || 0; lines.push(L.name + "  " + (L.fmt ? L.fmt(v) : num(v))); });
      if(opt.extra) lines = lines.concat(opt.extra(i));
      tip.textContent = lines.join("\n");
      tip.style.left = Math.max(70, Math.min(w - 70, x)) + "px";
      tip.style.top = "-6px";
      tip.classList.add("on");
    });
    hit.addEventListener("mouseleave", function(){ tip.classList.remove("on"); cross.setAttribute("opacity", 0); });
    s.appendChild(hit);
    wrap.appendChild(s);
  }
  requestAnimationFrame(draw);
  if(window.ResizeObserver){
    new ResizeObserver(function(){ if(!busy){ busy = true; requestAnimationFrame(function(){ busy = false; draw(); }); } }).observe(wrap);
  }
  return wrap;
}
/* 有活动的分钟 → 「时段」：相邻两分钟间隔 ≤ gap 分钟就算同一段（课间 10 分钟不拆）。回 [[首分钟, 末分钟], …] */
function spansOf(idx, gap){
  idx = idx.map(Number).sort(function(a,b){ return a - b; });
  var out = [];
  idx.forEach(function(i){
    var last = out[out.length - 1];
    if(last && i - last[1] <= gap) last[1] = i; else out.push([i, i]);
  });
  return out;
}

/* ---------- 渲染：额度 ----------
   ⚠️ 口径（2026-10-14 实测 Groq 响应头）：Groq 的限额是**连续回补**的令牌桶，不是到点清零 ——
      用掉 1 次，`x-ratelimit-reset-requests` 报 43.2 s（= 86400 / 2000）；用掉 3 次报 2m9.6s；
      音频秒每 0.5 s 回 1 秒（= 3600 / 7200）。
   ⭐ 2026-10-14 起 Worker 记下 Groq 每次回包报的剩余（`b.groq`，推算到此刻），并**拿它判**次数与小时音频秒；
      没报过（刚部署、还没调过）才退回 UTC 日 / 整点那套计数。所以这两格优先显示 Groq 报的「已用 = 上限 − 剩余」。 */
function qcell(label, used, cap, unit){
  var c = el("div","qcell");

  var track = el("div","mtrack"), i = el("i");
  var pct = cap ? Math.min(100, used / cap * 100) : 0;
  i.style.width = pct + "%";
  i.style.background = pct >= 95 ? "var(--bad)" : pct >= 80 ? "var(--warn)" : "var(--d1)";
  track.appendChild(i); c.appendChild(track);
  return c;
}

    "标「滚动」的两格是 Groq 自己回包报的剩余、推算到此刻，Worker 拿它判，剩 5% 就主动降级；" +

function lastDays(n){
  var out = [], d = new Date();
  for(var i = n - 1; i >= 0; i--){ out.push(new Date(d.getTime() - i*86400000).toISOString().slice(0,10)); }
  return out;
}
function mb(b){ return b >= 1e9 ? (b/1e9).toFixed(2) + " GB" : Math.round(b/1e6) + " MB"; }
// Workers Analytics 的 status 维度 → 人话（没列的原样显示）。clientDisconnected 是客户端先断了，不算 Worker 出错。
var CF_STATUS = {clientDisconnected:"客户端断开", scriptThrewException:"抛异常", exceededResources:"超资源",
  exceededCpu:"超 CPU", internalError:"内部错误", responseStreamDisconnected:"回包中断"};
function renderCf(){
  var box = $("#cf"); box.innerHTML = "";
  var cf = state.cf;
  if(!cf){ box.appendChild(el("div","empty","Cloudflare 的数暂时读不到。")); return; }
  if(cf.error){ box.appendChild(el("div","empty", cf.error)); return; }
  $("#cfnote").textContent = "近 24 h · 曲线是近 7 天（UTC 日）· Cloudflare 自己的统计约晚 1–3 分钟";
  var days = lastDays(7);
  Object.keys(cf.scripts).sort().forEach(function(name){
    var sc = cf.scripts[name];
    var bad = sc.requests ? sc.errors / sc.requests : 0;
    var other = Object.keys(sc.status).filter(function(k){ return k !== "success"; })
      .map(function(k){ return (CF_STATUS[k] || k) + " " + sc.status[k]; }).join(" · ");
    var errCell = scell("错误率", (bad*100).toFixed(bad && bad < 0.001 ? 2 : 1) + "%");
    if(bad > 0.01){ errCell.querySelector("b").style.color = "var(--bad)"; }
    box.appendChild(qrow(name.replace("classlive-", "Worker "), [
      scell("请求（24 h）", num(sc.requests), days.map(function(d){ return (cf.week[d] || {})[name] || 0; })),
      errCell,
      scell("CPU p50 / p99", sc.cpu_p50_ms + " / " + sc.cpu_p99_ms + " ms")
    ], other || "全部成功"));
  });
  var r2 = state.r2;
  if(r2 && !r2.error){
    var others = r2.sessions.filter(function(g){ return !g.mine; });
    box.appendChild(qrow("R2 " + r2.bucket.replace("classlive-", ""), [
      qcell("体积 / 免费档 10 GB", Math.round(r2.bytes/1e6), 10000, "MB"),
      scell("对象数", num(r2.objects)),
      scell("会话 · 别人的", r2.sessions.length + " 节 · " + others.length + " 节")
    ], "实时列桶（精确到对象）"));
    var tw = el("div"); tw.style.cssText = "padding:4px 0 10px";
    tw.appendChild(el("div","dtitle","上传的课（本机时刻 · 别人的全列，自己的列最近 5 节）"));
    var t = el("table"); var hr = el("tr");
    [["上传完",""],["是谁",""],["文件",""],["音频段","r"],["体积","r"]].forEach(function(x){ hr.appendChild(el("th", x[1], x[0])); });
    var th = el("thead"); th.appendChild(hr); t.appendChild(th);
    var tb = el("tbody"); t.appendChild(tb);
    var nMine = 0;
    r2.sessions.forEach(function(g){
      if(g.mine && ++nMine > 5) return;
      var tr = el("tr");
      tr.appendChild(el("td","mono", ago(Date.parse(g.last))));
      var who = el("td");
      if(g.mine) who.appendChild(document.createTextNode(g.name));
      else { who.appendChild(el("span","tag","别人")); who.appendChild(el("span","mono dim", " " + g.id)); }
      tr.appendChild(who);
      var lack = [];
      if(g.files.indexOf("transcript.md") < 0) lack.push("缺转录");
      tr.appendChild(el("td","dim", g.files.join("、") + (lack.length ? "（" + lack.join("、") + "：还在传或传了一半）" : "")));
      tr.appendChild(el("td","r mono", String(g.audio)));
      tr.appendChild(el("td","r mono", g.bytes >= 1e6 ? (g.bytes/1e6).toFixed(1) + " MB" : Math.round(g.bytes/1e3) + " KB"));
      tb.appendChild(tr);
    });
    tw.appendChild(t);
    tw.appendChild(el("div","hint","「别人」= 本机 sessions/ 和上传账本里都没有这个会话名。文件名就是桶里的原样；内容在 Cloudflare 后台看。"));
    box.appendChild(tw);
  } else {
    Object.keys(cf.r2).sort().forEach(function(name){
      var by = cf.r2[name], ds = Object.keys(by).sort(), last = by[ds[ds.length-1]], first = by[ds[0]];
      box.appendChild(qrow("R2 " + name.replace("classlive-", ""), [
        qcell("体积 / 免费档 10 GB", Math.round(last.bytes/1e6), 10000, "MB"),
        scell("对象数", num(last.objects), ds.map(function(d){ return by[d].objects; })),
        scell("7 天增量", "+" + mb(Math.max(0, last.bytes - first.bytes)))
      ], "Analytics 快照（慢 10–30 分钟）" + (r2 && r2.error ? " · 实时列桶失败：" + r2.error : "")));
    });
  }
  var mk = Object.keys(cf.minutes || {}).sort();
  if(mk.length){
    var t0 = Math.floor(Date.parse(cf.since) / 60000) * 60000;
    var lanes = mk.map(function(name, i){
      var pts = {}, src = cf.minutes[name];
      Object.keys(src).forEach(function(iso){ var k = Math.round((Date.parse(iso) - t0) / 60000); if(k >= 0 && k < 1440) pts[k] = src[iso][0]; });
      return {name: name.replace("classlive-", "Worker "), color: i ? "var(--d2)" : "var(--d1)", pts: pts};
    });
    var errs = {};
    mk.forEach(function(name){ var src = cf.minutes[name];
      Object.keys(src).forEach(function(iso){ if(src[iso][1]){ var k = Math.round((Date.parse(iso) - t0) / 60000); errs[k] = (errs[k] || 0) + src[iso][1]; } }); });
    var mw = el("div"); mw.style.cssText = "padding:12px 0 4px";
    mw.appendChild(el("div","dtitle","近 24 h 每分钟请求（本机时刻 · 悬停看读数）"));
    mw.appendChild(minuteChart(lanes, t0, 1440, {laneH: 34, label: "Cloudflare 近 24 小时逐分钟请求",
      dateOf: function(ms){ var d = new Date(ms); return (d.getMonth()+1) + "-" + d.getDate(); },
      extra: function(i){ return errs[i] ? ["出错  " + errs[i]] : []; }}));
    box.appendChild(mw);
  }
  var dk = Object.keys(cf.dos).sort();
  if(dk.length){
    box.appendChild(qrow("Durable Objects", [
      scell("今日请求", num(cf.dos[dk[dk.length-1]] || 0), days.map(function(d){ return cf.dos[d] || 0; })),
      scell("7 天合计", num(dk.reduce(function(a, d){ return a + cf.dos[d]; }, 0))),
      scell("", "")
    ], "通行码与额度的账本"));
  }
}

/* ---------- 渲染：用户表 ---------- */
function statusOf(c){
  if(c.revoked) return ["bad", "吊销"];
  if(c.expires && c.expires < Date.now()) return ["warn", "过期"];
  return ["ok", "有效"];
}
function renderUsers(){
  var box = $("#users"); box.innerHTML = "";
  var all = state.codes.slice().sort(function(a,b){ return (b.last_seen||0) - (a.last_seen||0); });

  var dead = all.filter(function(c){ return c.revoked; });
  var codes = state.showRevoked ? all : all.filter(function(c){ return !c.revoked || c.code === state.expanded; });
  $("#unote").textContent = state.days + " 天 · " + (all.length - dead.length) + " 个在册" + (dead.length ? " · " + dead.length + " 个已吊销" : "");

    var em = el("div","empty");
    em.appendChild(el("b", null, "还没有任何通行码"));
    em.appendChild(document.createTextNode("点右上角「发新码」。"));

  }

  var t = el("table");
  var hr = el("tr");
  [["名字",""],["状态",""],["设备","r"],["到期",""],["最后在线",""],["每日转写","sp"],["转写 (分)","r"],
   ["段","r"],["翻译","r"],["花费 (闲时价)","r"]].forEach(function(c){ hr.appendChild(el("th", c[1], c[0])); });
  var thead = el("thead"); thead.appendChild(hr); t.appendChild(thead);
  var tb = el("tbody"); t.appendChild(tb);

  codes.forEach(function(c){
    var agg = sumRows(allRows(), c.code);
    var ser = series(c.code, function(u){ return u.asr_s/60; });
    var st = statusOf(c);
    var tr = el("tr","body");

    var td0 = el("td"); td0.appendChild(el("span","chev","›")); td0.appendChild(document.createTextNode(" " + c.name));
    // 「测试」：名字 test 开头的码（实验 / 探针专用，`load_test_key`）。
    if(/^test/.test(c.name)) td0.appendChild(el("span","tag","测试"));
    // 「只有翻译」：有翻译、没转写 → 多半不是上课（2026-10-14：实验走了 owen 的码，那天没课）。
    //   ⚠️ 关了云端转写的人上课也会是 0 → 只提示，不下结论。
    var odd = state.days_data.filter(function(d){
      var u = (d.rows || []).filter(function(r){ return r.code === c.code; })[0];
      return u && u.llm_reqs > 0 && !u.asr_reqs;
    }).map(function(d){ return d.day === utcToday() ? "今天" : d.day.slice(5); });
    if(odd.length){

      tg2.title = odd.join("、") + "：有翻译、没有云端转写 —— 多半是实验 / 测试；关了云端转写的人上课也会这样";
      td0.appendChild(tg2);
    }
    tr.appendChild(td0);
    var td1 = el("td"); var chip = el("span","dotm " + st[0]);
    chip.appendChild(el("i")); chip.appendChild(document.createTextNode(st[1]));
    td1.appendChild(chip);                                  /* ⚠️ 忘了这一行 = 整列状态是空的 */
    tr.appendChild(td1);
    tr.appendChild(el("td","r mono", c.devices + "/" + c.max_devices));
    tr.appendChild(el("td","mono dim", ymd(c.expires)));
    tr.appendChild(el("td","dim", ago(c.last_seen)));
    var tdS = el("td","sp"); tdS.appendChild(sparkline(ser.map(function(x){ return x.v; }), {h:20, color:"var(--d1)"}));
    tr.appendChild(tdS);
    tr.appendChild(el("td","r mono", mins(agg.asr_s)));
    tr.appendChild(el("td","r mono", num(agg.asr_reqs)));
    tr.appendChild(el("td","r mono", num(agg.llm_reqs)));
    tr.appendChild(el("td","r mono", "$" + cluiCost(agg, state.prices).toFixed(3)));
    function toggle(){ state.expanded = state.expanded === c.code ? null : c.code; renderUsers(); }

    tr.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } });

  });

  if(dead.length){
    var tg = btn(state.showRevoked ? "收起已吊销的 " + dead.length + " 个" : "显示已吊销的 " + dead.length + " 个", "toggle",
      function(){ state.showRevoked = !state.showRevoked; renderUsers(); });

  right.appendChild(hBars(models, {empty:"这段记录里没有这个字段。模型是 2026-10-14 起才记的，之前的老记录补不回来。"}));

    if(!c.revoked && !confirm("确认吊销「" + c.name + "」？他那边立刻用不了云端，本地照旧。")) return;
    act(c, c.revoked ? "unrevoke" : "revoke", {});
  }, c.revoked ? "" : "danger"));

    act(c, "limit", {daily_asr_s: n}); }, "不限"));

/* ---------- 抽屉：逐分钟 / 逐日 / 设备（2026-10-14 作者：「精确到分钟、数值再详细一点」）---------- */
function dayKey(c, d){ return c.code + "|" + d; }
function renderMinutes(c, box){
  box.innerHTML = "";
  var used = state.days_data.filter(function(d){
    return (d.rows || []).some(function(r){ return r.code === c.code && (r.asr_reqs || r.llm_reqs || r.jev_reqs); });
  }).map(function(d){ return d.day; });
  var hd = el("div","dtitle"); hd.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap";
  hd.appendChild(el("span", null, "逐分钟（本机时刻 · 一格一分钟 · 悬停看读数）"));
  if(!used.length){ box.appendChild(hd); box.appendChild(el("div","hint","这段时间没有用量。")); return; }
  var pick = state.minDay[c.code] && used.indexOf(state.minDay[c.code]) >= 0 ? state.minDay[c.code] : used[used.length - 1];
  var seg = el("div","seg");
  used.slice(-7).forEach(function(d){
    var b = el("button", null, d === utcToday() ? "今天" : d.slice(5));
    b.setAttribute("aria-pressed", String(d === pick));
    b.addEventListener("click", function(e){ e.stopPropagation(); state.minDay[c.code] = d; renderMinutes(c, box); });
    seg.appendChild(b);
  });
  hd.appendChild(seg);
  hd.appendChild(el("span","faint","（日子按 UTC 切，同 Worker 记账）"));
  box.appendChild(hd);
  var body = el("div"); box.appendChild(body);
  var k = dayKey(c, pick);
  function paint(mm){
    body.innerHTML = "";
    if(mm.error){
      body.appendChild(el("div","hint", /not found|不认/.test(mm.error)
        ? "Worker 还没有逐分钟接口（要部署一次 classlive-asr）。部署之后才开始记，之前的分钟补不回来。"
        : "读不到逐分钟：" + mm.error));
      return;
    }
    var mins = mm.mins || {}, idx = Object.keys(mins);
    if(!idx.length){ body.appendChild(el("div","hint","这一天没有逐分钟记录（逐分钟是 2026-10-14 晚部署后才开始记的）。")); return; }
    var t0 = Date.parse(pick + "T00:00:00Z");
    var asr = {}, llm = {}, tok = {};
    idx.forEach(function(i){ var v = mins[i]; asr[i] = v[0]; llm[i] = v[2] + (v[4] || 0); tok[i] = v[3]; });
    // 时段：间隔 ≤ 10 分钟算同一段
    var spans = spansOf(idx, 10);
    var lo = Math.max(0, spans[0][0] - 20), hi = Math.min(1439, spans[spans.length-1][1] + 20);   /* 只画有活动的那一截 ± 20 分钟 */
    function sub(o){ var r = {}; Object.keys(o).forEach(function(i){ if(i >= lo && i <= hi) r[i - lo] = o[i]; }); return r; }
    body.appendChild(minuteChart([
      {name:"转写（段）", color:"var(--d1)", pts: sub(asr)},
      {name:"翻译（次）", color:"var(--d2)", pts: sub(llm)},
      {name:"token", color:"var(--d3)", pts: sub(tok), fmt: function(v){ return num(v); }}
    ], t0 + lo * 60000, hi - lo + 1, {label: c.name + " " + pick + " 逐分钟",
      extra: function(i){ var v = mins[i + lo]; return v ? ["转写秒  " + num(v[1], 1)].concat(v[4] ? ["Jev  " + v[4]] : []) : []; }}));
    var t = el("table"); t.style.marginTop = "10px";
    var hr = el("tr");
    [["时段（本机）",""],["时长","r"],["有活动","r"],["转写 (分)","r"],["段","r"],["翻译","r"],["token","r"],["Jev","r"]]
      .forEach(function(x){ hr.appendChild(el("th", x[1], x[0])); });
    var th = el("thead"); th.appendChild(hr); t.appendChild(th);
    var tb = el("tbody"); t.appendChild(tb);
    spans.forEach(function(sp){
      var a = {n:0, segs:0, sec:0, llm:0, tok:0, jev:0};
      idx.forEach(function(i){ if(+i >= sp[0] && +i <= sp[1]){ var v = mins[i]; a.n++; a.segs += v[0]; a.sec += v[1]; a.llm += v[2]; a.tok += v[3]; a.jev += (v[4] || 0); } });
      var tr = el("tr");
      tr.appendChild(el("td","mono", hm(t0 + sp[0]*60000) + " – " + hm(t0 + (sp[1]+1)*60000)));
      tr.appendChild(el("td","r mono", (sp[1] - sp[0] + 1) + " 分"));
      tr.appendChild(el("td","r mono", a.n + " 分"));
      tr.appendChild(el("td","r mono", num(a.sec/60, 1)));
      tr.appendChild(el("td","r mono", num(a.segs)));
      tr.appendChild(el("td","r mono", num(a.llm)));
      tr.appendChild(el("td","r mono", num(a.tok)));
      tr.appendChild(el("td","r mono", num(a.jev)));
      tb.appendChild(tr);
    });
    body.appendChild(t);
    body.appendChild(el("div","hint","时段 = 相邻两次用量隔不到 10 分钟就算同一段。「有活动」是这段里真有请求的分钟数。"));
  }
  if(state.minCache[k] && pick !== utcToday()) return paint(state.minCache[k]);
  body.appendChild(el("div","hint","读取中…"));
  api("minutes", {code: c.code, day: pick})
    .then(function(r){ state.minCache[k] = r; paint(r); })
    .catch(function(e){ paint({error: e.message}); });
}
function dayTable(c){
  var box = el("div"); box.style.marginBottom = "18px";
  box.appendChild(el("div","dtitle","逐日明细（UTC 日）"));
  var t = el("table");
  var hr = el("tr");
  [["日期",""],["转写 (分)","r"],["段","r"],["活跃分钟","r"],["翻译","r"],["输入 tok","r"],["命中","r"],["输出 tok","r"],["Jev","r"],["花费","r"]]
    .forEach(function(x){ hr.appendChild(el("th", x[1], x[0])); });
  var th = el("thead"); th.appendChild(hr); t.appendChild(th);
  var tb = el("tbody"); t.appendChild(tb);
  var n = 0;
  state.days_data.slice().reverse().forEach(function(d){
    var u = (d.rows || []).filter(function(r){ return r.code === c.code; })[0];
    if(!u || !(u.asr_reqs || u.llm_reqs || u.jev_reqs)) return;
    n++;
    var tr = el("tr");
    tr.appendChild(el("td","mono", d.day === utcToday() ? d.day + "（今天）" : d.day));
    tr.appendChild(el("td","r mono", num((u.asr_s || 0)/60, 1)));
    tr.appendChild(el("td","r mono", num(u.asr_reqs || 0)));
    tr.appendChild(el("td","r mono", u.active_min == null ? "—" : num(u.active_min)));
    tr.appendChild(el("td","r mono", num(u.llm_reqs || 0)));
    tr.appendChild(el("td","r mono", num(u.tokens_in || 0)));
    tr.appendChild(el("td","r mono", u.tokens_in ? Math.round((u.cache_hit || 0) / u.tokens_in * 100) + "%" : "—"));
    tr.appendChild(el("td","r mono", num(u.tokens_out || 0)));
    tr.appendChild(el("td","r mono", (u.jev_reqs || 0) + " / " + (u.jev_q || 0)));
    tr.appendChild(el("td","r mono", "$" + cluiCost(u, state.prices).toFixed(4)));
    tb.appendChild(tr);
  });
  if(!n){ box.appendChild(el("div","hint","这段时间没有用量。")); return box; }
  box.appendChild(t);
  box.appendChild(el("div","hint","「活跃分钟」= 当天有请求的分钟数（逐分钟上线前的日子是 —）。Jev 是「次 / 题」。"));
  return box;
}
function renderDevices(c, box){
  box.innerHTML = "";
  box.appendChild(el("div","dtitle","设备（只显示安装号前 6 位）"));
  function paint(r){
    if(r.error){ box.appendChild(el("div","hint", /not found|不认/.test(r.error)
      ? "Worker 还没有设备接口（要部署一次 classlive-asr）。现在只知道台数：" + c.devices + " / " + c.max_devices
      : "读不到设备：" + r.error)); return; }
    if(!r.devices.length){ box.appendChild(el("div","hint","还没有设备登记过（码发出去还没用过）。")); return; }
    var t = el("table"); var hr = el("tr");
    [["安装号",""],["第一次",""],["最近一次",""]].forEach(function(x){ hr.appendChild(el("th", x[1], x[0])); });
    var th = el("thead"); th.appendChild(hr); t.appendChild(th);
    var tb = el("tbody"); t.appendChild(tb);
    r.devices.forEach(function(d){
      var tr = el("tr");
      tr.appendChild(el("td","mono", d.id + "…"));
      tr.appendChild(el("td","mono dim", ago(d.first)));
      tr.appendChild(el("td","mono", ago(d.last)));
      tb.appendChild(tr);
    });
    box.appendChild(t);
    if(r.devices.length >= c.max_devices) box.appendChild(el("div","hint","设备名额已满：第 " + (c.max_devices + 1) + " 台机器会登不上。"));
  }
  api("devices", {code: c.code}).then(paint).catch(function(e){ paint({error: e.message}); });
}
function btn(label, cls, fn, danger){
  var b = el("button", (cls ? cls + " " : "") + (danger || ""), label);
  b.addEventListener("click", function(e){ e.stopPropagation(); fn(); });
  return b;
}
function fld(label, val, fn, ph){
  var w = el("div","fld"); w.appendChild(el("label", null, label));
  var i = el("input"); i.value = val; i.placeholder = ph || "";
  i.addEventListener("click", function(e){ e.stopPropagation(); });
  w.appendChild(i);
  w.appendChild(btn("改", "", function(){ fn(i.value); }));
  return w;
}
function fldbtn(label, text, fn, danger){
  var w = el("div","fld"); w.appendChild(el("label", null, label));
  var b = btn(text, "", fn, danger); b.style.width = "100%"; w.appendChild(b);
  return w;
}
function act(c, name, body){
  if(state.busy) return;
  state.busy = true; progress(true);
  api(name, Object.assign({code: c.code}, body))
    .then(function(){ return load(); })
    .catch(function(e){ showErr(e.message); })
    .then(function(){ state.busy = false; progress(false); });
}
function showErr(msg){
  var box = $("#err"); box.innerHTML = "";
  var b = el("div","banner");
  var s = el("div");
  s.appendChild(el("b", null, "没做成："));
  s.appendChild(document.createTextNode(String(msg)));
  b.appendChild(s);
  b.appendChild(btn("×", "", function(){ box.innerHTML = ""; }));
  box.appendChild(b);
  window.scrollTo(0, 0);
}

/* ---------- 渲染：价目表 ---------- */
function renderPrices(){
  var box = $("#prices"); box.innerHTML = "";
  var t = el("table","autow"); t.style.width = "auto";
  var tb = el("tbody");
  [["cache","输入 token · 缓存命中"],["miss","输入 token · 未命中"],["out","输出 token"]].forEach(function(row){
    var tr = el("tr");
    var td0 = el("td"); td0.appendChild(el("label", null, row[1])); tr.appendChild(td0);
    var td1 = el("td","r"); var inp = el("input","mono");
    inp.style.cssText = "width:104px;text-align:right";
    inp.value = String(state.prices[row[0]]); inp.type = "number"; inp.step = "0.001"; inp.min = "0";
    inp.addEventListener("change", function(){
      var n = Number(inp.value);
      state.prices[row[0]] = isFinite(n) && n >= 0 ? n : 0;
      localStorage.setItem("clui-prices", JSON.stringify(state.prices));
      renderKpis(); renderUsers();
    });
    td1.appendChild(inp); tr.appendChild(td1);
    tr.appendChild(el("td","faint","US$ 每百万 token"));
    tb.appendChild(tr);
  });
  t.appendChild(tb); box.appendChild(t);
  box.appendChild(el("p","hint","默认值是 deepseek-flash 闲时价（2026-10-14 回源 api-docs.deepseek.com 核过，与 docs/PLAN-passkey.md §5 一致）。" +
    "价目会变，所以这里不写死：改了立刻重算。UTC 周一至五 01 到 04、06 到 10 点是高峰，价乘 2。" +
    "只统计翻译的 token，不含整课精修 / 实时总结 / 讲解追问。"));
}

/* ---------- 发新码 ---------- */
function renderAddForm(){
  var box = $("#addform"); box.innerHTML = "";
  if(box.hidden) return;
  var wrap = el("div");
  wrap.style.cssText = "display:flex;gap:12px;align-items:flex-end;padding:12px 16px;background:var(--surface);" +
                       "border-radius:var(--r);box-shadow:var(--ring2);margin-bottom:12px;flex-wrap:wrap";
  var n = el("div"); n.style.width = "190px"; n.appendChild(el("label", null, "名字（1 到 16 位小写字母或数字）"));
  var ni = el("input"); ni.placeholder = "例如 liming"; n.appendChild(ni);
  var d = el("div"); d.style.width = "100px"; d.appendChild(el("label", null, "有效天数"));
  var di = el("input"); di.value = "120"; d.appendChild(di);
  var dev = el("div"); dev.style.width = "100px"; dev.appendChild(el("label", null, "最多设备"));
  var dvi = el("input"); dvi.value = "2"; dev.appendChild(dvi);
  var go = btn("生成", "primary", function(){});
  var out = el("div","hint");
  go.addEventListener("click", function(){
    go.disabled = true;
    api("add", {name: ni.value.trim().toLowerCase(), days: parseInt(di.value,10) || 120, max_devices: parseInt(dvi.value,10) || 2})
      .then(function(r){
        out.innerHTML = ""; out.style.color = "";
        out.appendChild(document.createTextNode("生成好了，把这一串发给他（粘进「翻译引擎 → 填 key」）："));
        var code = el("b","mono"); code.style.cssText = "display:block;font-size:14px;margin:5px 0"; code.textContent = r.code;
        out.appendChild(code);
        out.appendChild(document.createTextNode("到期 " + ymd(r.expires) + " · 最多 " + r.max_devices + " 台设备"));
        ni.value = ""; return load();
      })
      .catch(function(e){ out.style.color = "var(--bad)"; out.textContent = "没做成：" + e.message; })
      .then(function(){ go.disabled = false; });
  });
  [n, d, dev, go].forEach(function(x){ wrap.appendChild(x); });
  box.appendChild(wrap); box.appendChild(out);
}

/* ---------- 加载 ---------- */
function load(){
  progress(true);
  state.loading = true;
  return Promise.all([
    api("list", {}),
    api("stats", {days: state.days}),
    api("quota", {}).catch(function(){ return null; }),
    api("r2", {}).catch(function(e){ return {error: e.message}; }),
    api("cf", {}).catch(function(e){ return {error: "面板服务没回 Cloudflare 的数（" + e.message +
      "）。多半是面板服务比这个页面旧：在终端按 Ctrl+C 停掉 cl_admin_ui.py 再开一次。"}; })
  ]).then(function(r){
    state.codes = r[0].codes || [];
    state.days_data = r[1].days || [];
    state.quota = r[2];
    state.cf = r[4];
    state.r2 = r[3];
    var now = new Date();
    $("#fresh").textContent = "更新于 " + hm(now.getTime()) + ":" + String(now.getSeconds()).padStart(2,"0");
    state.loaded = true;
    // `?open=<名字>` 只为截图核对用（无头浏览器点不开抽屉）；只在第一次加载时生效。
    var qOpen = new URLSearchParams(location.search).get("open");
    if(qOpen && !state.openedOnce){ state.openedOnce = true;
      var hitc = state.codes.filter(function(c){ return c.name === qOpen; })[0]; if(hitc) state.expanded = hitc.code; }
    $("#err").innerHTML = "";
    renderKpis(); renderDaily(); renderPerUser(); renderQuota(); renderCf(); renderUsers();
  }).catch(function(e){ showErr(e.message); })
    .then(function(){ progress(false); state.loading = false; });
}

/* ---------- 事件 ---------- */
$("#range").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  state.days = parseInt(b.dataset.days, 10);
  [].forEach.call(this.children, function(x){ x.setAttribute("aria-pressed", String(x === b)); });
  load();
});
$("#metric").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  state.metric = b.dataset.m;
  [].forEach.call(this.children, function(x){ x.setAttribute("aria-pressed", String(x === b)); });
  renderDaily(); renderPerUser();
});
$("#theme").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  state.theme = b.dataset.theme; applyTheme();
});
$("#refresh").addEventListener("click", function(){ load(); });
// 自动刷新：60 秒一次。⚠️ 标签页在后台（浏览器会节流定时器、数也没人看）、正在填表 / 发码、上一轮没回来时都跳过 ——
//   重画会把输入框里打了一半的字冲掉。
setInterval(function(){
  if(document.visibilityState !== "visible" || state.busy || state.loading) return;
  var a = document.activeElement;
  if(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return;
  if(!$("#addform").hidden) return;
  load();
}, 60000);
$("#addbtn").addEventListener("click", function(){
  var box = $("#addform"); box.hidden = !box.hidden; renderAddForm();
});

// `?theme=dark|light` 只为截图核对用（无头浏览器不好改 localStorage）；不写回存储。
var qTheme = new URLSearchParams(location.search).get("theme");
state.theme = (qTheme === "dark" || qTheme === "light") ? qTheme : (localStorage.getItem("clui-theme") || "auto");
applyTheme();
renderPrices();
(function skeleton(){
  var box = $("#kpis");
  for(var i = 0; i < 4; i++){
    var c = el("div","kpi");
    var a = el("div","skel"); a.style.width = "52%"; c.appendChild(a);
    var b = el("div","skel"); b.style.cssText = "width:70%;height:24px;margin:10px 0 8px"; c.appendChild(b);
    var d = el("div","skel"); d.style.width = "40%"; c.appendChild(d);
    box.appendChild(c);
  }
})();
load();
})();
</script>
</body>
