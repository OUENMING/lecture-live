<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pineapple 控制台</title>
<style>
/* ================================================================
   设计语言：macOS / iOS 原生（系统分组背景 + 白卡 + 发丝线 + 系统色）。
   规矩（来自 dashboard-design-skill + Apple HIG Charts）：
   · 一屏一问；KPI 下不写句子，解释进 tooltip。
   · 安静：健康 = 灰 + 一个强调色；暖色 / 红只给异常。
   · 图表只用线 / 柱 / 点，Y 轴整数刻度、≈4 条淡网格；柱状下界 0。
   · 数字一律 tabular。无数据写「—」不写 0。
   ================================================================ */
:root{
  --bg:#f2f2f7; --card:#fff; --soft:#f7f7f9; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.08);
  --sep:rgba(60,60,67,.12); --sep2:rgba(60,60,67,.07);
  --ink:#1d1d1f; --ink2:rgba(60,60,67,.66); --ink3:rgba(60,60,67,.38);
  --blue:#007aff; --green:#248a3d; --green-d:#34c759; --orange:#c93400; --orange-d:#ff9500; --red:#d70015; --red-d:#ff3b30;
  --indigo:#5856d6; --teal:#0071a4; --purple:#8944ab; --mint:#0c817b; --pink:#d30f45; --yellow:#b25000;
  --c1:#007aff; --c2:#5ac8fa; --c3:#5856d6; --c4:#34c759; --c5:#ff9500; --c6:#af52de; --c7:#8e8e93;
  --tint:rgba(0,122,255,.10); --ring:rgba(0,122,255,.24);
  --warn-bg:rgba(255,149,0,.12); --bad-bg:rgba(255,59,48,.10); --ok-bg:rgba(52,199,89,.12);
  --glass:rgba(246,246,248,.72); --glass-b:rgba(255,255,255,.6);
  --shadow:0 1px 1px rgba(0,0,0,.02),0 2px 10px rgba(0,0,0,.03);
  --shadow-lg:0 10px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
  --tip:rgba(28,28,30,.94); --tip-ink:#fff;
  --r:18px; --r-s:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#000; --card:#1c1c1e; --soft:#242426; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.16);
  --sep:rgba(84,84,88,.55); --sep2:rgba(84,84,88,.32);
  --ink:#f5f5f7; --ink2:rgba(235,235,245,.62); --ink3:rgba(235,235,245,.32);
  --blue:#0a84ff; --green:#30d158; --green-d:#30d158; --orange:#ff9f0a; --orange-d:#ff9f0a; --red:#ff453a; --red-d:#ff453a;
  --indigo:#5e5ce6; --teal:#40c8e0; --purple:#bf5af2; --mint:#63e6e2; --pink:#ff375f; --yellow:#ffd60a;
  --c1:#0a84ff; --c2:#64d2ff; --c3:#5e5ce6; --c4:#30d158; --c5:#ff9f0a; --c6:#bf5af2; --c7:#8e8e93;
  --tint:rgba(10,132,255,.18); --ring:rgba(10,132,255,.36);
  --warn-bg:rgba(255,159,10,.16); --bad-bg:rgba(255,69,58,.16); --ok-bg:rgba(48,209,88,.14);
  --glass:rgba(28,28,30,.72); --glass-b:rgba(255,255,255,.06);
  --shadow:0 0 0 .5px rgba(255,255,255,.04);
  --shadow-lg:0 10px 40px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.08);
  --tip:rgba(58,58,60,.96); --tip-ink:#fff;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000; --card:#1c1c1e; --soft:#242426; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.16);
  --sep:rgba(84,84,88,.55); --sep2:rgba(84,84,88,.32);
  --ink:#f5f5f7; --ink2:rgba(235,235,245,.62); --ink3:rgba(235,235,245,.32);
  --blue:#0a84ff; --green:#30d158; --green-d:#30d158; --orange:#ff9f0a; --orange-d:#ff9f0a; --red:#ff453a; --red-d:#ff453a;
  --indigo:#5e5ce6; --teal:#40c8e0; --purple:#bf5af2; --mint:#63e6e2; --pink:#ff375f; --yellow:#ffd60a;
  --c1:#0a84ff; --c2:#64d2ff; --c3:#5e5ce6; --c4:#30d158; --c5:#ff9f0a; --c6:#bf5af2; --c7:#8e8e93;
  --tint:rgba(10,132,255,.18); --ring:rgba(10,132,255,.36);
  --warn-bg:rgba(255,159,10,.16); --bad-bg:rgba(255,69,58,.16); --ok-bg:rgba(48,209,88,.14);
  --glass:rgba(28,28,30,.72); --glass-b:rgba(255,255,255,.06);
  --shadow:0 0 0 .5px rgba(255,255,255,.04);
  --shadow-lg:0 10px 40px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.08);
  --tip:rgba(58,58,60,.96); --tip-ink:#fff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em}
.mut{color:var(--ink2)} .mut3{color:var(--ink3)}
.ok-t{color:var(--green)} .warn-t{color:var(--orange)} .bad-t{color:var(--red)}
::selection{background:var(--ring)}

/* ---------- 外框：侧栏（毛玻璃）+ 内容 ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 12px;display:flex;flex-direction:column;gap:2px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-right:.5px solid var(--sep);z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(160deg,#ffd60a,#ff9f0a);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.02em;display:block}
.brand small{font-size:11.5px;color:var(--ink2)}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;border:0;background:none;
  color:var(--ink);cursor:pointer;width:100%;text-align:left;font-size:13.5px;transition:background .15s}
.nav:hover{background:var(--fill2)}
.nav svg{width:18px;height:18px;flex:none;color:var(--blue)}
.nav .badge{margin-left:auto;min-width:18px;height:18px;padding:0 6px;border-radius:9px;font-size:11px;font-weight:600;
  display:grid;place-items:center;background:var(--fill);color:var(--ink2)}
.nav .badge.bad{background:var(--red-d);color:#fff} .nav .badge.warn{background:var(--orange-d);color:#fff}
.nav[aria-current="page"]{background:var(--tint);box-shadow:inset 0 0 0 .5px var(--ring);font-weight:500}
.side .grow{flex:1}
.side-foot{padding:10px;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--ink2)}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green-d);margin-right:6px;
  box-shadow:0 0 0 0 rgba(52,199,89,.5);animation:pulse 2.4s infinite}
.live-dot.off{background:var(--ink3);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.45)}70%{box-shadow:0 0 0 7px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}

main{min-width:0;padding:0 28px 60px}
.toolbar{position:sticky;top:0;z-index:15;margin:0 -28px;padding:14px 28px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-bottom:.5px solid transparent;transition:border-color .2s}
.toolbar.scrolled{border-bottom-color:var(--sep)}
.toolbar h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.toolbar .sp{flex:1}

/* 顶部状态条（Dash bar）：一排胶囊，所有页面都在 */
.dash{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:15px;background:var(--card);
  box-shadow:var(--shadow);border:.5px solid var(--sep2);font-size:12.5px;color:var(--ink2);white-space:nowrap;cursor:default}
.pill b{color:var(--ink);font-weight:600}
.pill.warn{background:var(--warn-bg);border-color:transparent} .pill.warn b{color:var(--orange)}
.pill.bad{background:var(--bad-bg);border-color:transparent} .pill.bad b{color:var(--red)}
.pill .ic{width:14px;height:14px;color:var(--ink3)}
.pill.sk{width:120px;background:var(--fill2);box-shadow:none;border:0}

/* 分段控件（iOS segmented） */
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--fill);gap:2px;position:relative}
.seg button{border:0;background:none;padding:4px 13px;border-radius:7px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--ink);min-height:26px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 13px;border-radius:8px;border:0;
  background:var(--fill);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;transition:filter .15s,transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(.96)} .btn:active{transform:scale(.97)}
.btn.pri{background:var(--blue);color:#fff}
.btn.danger{background:var(--bad-bg);color:var(--red)}
.btn.plain{background:none;color:var(--blue);padding:0 6px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:15px;height:15px}
.icbtn{width:30px;height:30px;padding:0;border-radius:15px;display:inline-grid;place-items:center;border:0;background:var(--fill2);color:var(--ink2);cursor:pointer}
.icbtn:hover{background:var(--fill);color:var(--ink)}
.icbtn svg{width:15px;height:15px}
.icbtn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Bento 栅格 + 卡片 ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:.5px solid var(--sep2);padding:18px 20px;min-width:0;
  }
.anim .card{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadein{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card.flush{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:24px}
.card.flush .ch{padding:16px 20px 0;margin-bottom:10px}
.ch h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.012em}
.ch .sub{font-size:12px;color:var(--ink2)}
.ch .sp{flex:1}
.age{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.ch .icbtn{width:24px;height:24px;background:none} .ch .icbtn svg{width:13px;height:13px}
.sec-t{font-size:12px;font-weight:600;color:var(--ink2);text-transform:none;margin:26px 2px 10px;letter-spacing:.01em}

/* KPI：一张卡里用发丝线分隔多个 tile */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0}
.kpi{padding:18px 20px 16px;border-left:.5px solid var(--sep);min-width:0;position:relative}
.kpi:first-child{border-left:0}
.kpi .lb{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin:6px 0 4px;white-space:nowrap}
.kpi .v small{font-size:15px;font-weight:500;color:var(--ink2);letter-spacing:-.01em;margin-left:2px}
.kpi .d{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;min-height:17px}
.kpi .d .up{color:var(--ink)} .kpi .d .bad{color:var(--red)} .kpi .d .good{color:var(--green)}
.kpi .spark{position:absolute;right:16px;bottom:16px;width:84px;height:28px}
.kpi.sk .v{width:60%;height:30px;border-radius:8px;background:var(--fill2)}

/* 列表（iOS inset grouped） */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 20px;border-top:.5px solid var(--sep2);min-height:48px;cursor:default;position:relative}
.row:first-child{border-top:0}
.row.click{cursor:pointer;transition:background .12s}
.row.click:hover{background:var(--fill2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-size:13px;white-space:nowrap}
.chev{width:8px;height:13px;color:var(--ink3);flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink3)}
.dot.ok{background:var(--green-d)} .dot.warn{background:var(--orange-d)} .dot.bad{background:var(--red-d)} .dot.live{background:var(--green-d);animation:pulse 2.4s infinite}

.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:11.5px;font-weight:500;background:var(--fill2);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--green)} .chip.warn{background:var(--warn-bg);color:var(--orange)} .chip.bad{background:var(--bad-bg);color:var(--red)} .chip.blue{background:var(--tint);color:var(--blue)}
.chips{display:flex;gap:5px;flex-wrap:wrap}

/* 表格 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:500;color:var(--ink2);text-align:left;padding:8px 12px;border-bottom:.5px solid var(--sep);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:9px 12px;border-bottom:.5px solid var(--sep2);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--fill2)}
td.wrap{white-space:normal;min-width:160px}
th:first-child,td:first-child{padding-left:20px} th:last-child,td:last-child{padding-right:20px}

/* 细份额条 / 子弹条 */
.bar{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--blue);transform-origin:left}
.anim .bar i{animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.bar.thin{height:3px}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .top{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}
.meter .top b{font-weight:600}

/* 状态消息 */
.err{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--bad-bg);color:var(--red);font-size:13px}
.err .btn{margin-left:auto;height:26px;font-size:12px}
.empty{padding:26px 10px;text-align:center;color:var(--ink2);font-size:13px}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:3px;font-size:14px}
.sk-line{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--fill2) 0%,var(--fill) 50%,var(--fill2) 100%);background-size:200% 100%;animation:shimmer 1.3s infinite;margin:10px 0}
@keyframes shimmer{to{background-position:-200% 0}}

/* 提醒 */
.alert{display:grid;grid-template-columns:22px 1fr auto;gap:2px 10px;padding:12px 20px;border-top:.5px solid var(--sep2);align-items:start}
.alert:first-child{border-top:0}
.alert .ai{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.alert .ai svg{width:13px;height:13px;color:#fff}
.alert.bad .ai{background:var(--red-d)} .alert.warn .ai{background:var(--orange-d)} .alert.ok .ai{background:var(--green-d)}
.alert .at{font-weight:500;font-size:13.5px}
.alert .ad{grid-column:2/4;font-size:12.5px;color:var(--ink2)}
.alert .aw{font-size:11.5px;color:var(--ink3);white-space:nowrap}

/* 图表 */
.chart{position:relative;width:100%;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font:11px var(--font);fill:var(--ink3);font-variant-numeric:tabular-nums}
.chart .grid-l{stroke:var(--sep2);stroke-width:1}
.chart .base-l{stroke:var(--sep);stroke-width:1}
.chart .hl{stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--tip);color:var(--tip-ink);border-radius:10px;padding:8px 11px;
  font-size:12px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.22);max-width:340px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#tip.on{opacity:1;transform:none}
#tip .tv{font-size:15px;font-weight:600;letter-spacing:-.01em}
#tip .tl{color:rgba(255,255,255,.62)}
#tip .tr{display:flex;gap:8px;align-items:center;justify-content:space-between}
#tip .tr i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:5px}
#tip pre{margin:0;font:11px/1.4 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:hidden}

/* 人：卡片网格 */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pc{cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
.pc:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.pc .top{display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;flex:none;letter-spacing:-.02em}
.pc .nm{font-weight:600;font-size:15.5px;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .meta{font-size:12px;color:var(--ink2)}
.pc .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 12px}
.pc .stats div{font-size:11.5px;color:var(--ink2)}
.pc .stats b{display:block;font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.seats{display:inline-flex;gap:3px;vertical-align:middle;margin-right:4px}
.seats i{width:9px;height:9px;border-radius:3px;background:var(--fill)}
.seats i.d{background:var(--c1)} .seats i.w{background:var(--c2)}
.seats.full i.d,.seats.full i.w{background:var(--orange-d)}
.hrs{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:16px;margin-top:6px}
.hrs i{border-radius:2px;background:var(--fill2)}

/* 面板（Sheet）：右侧滑出；手机变底部抽屉 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:10px;right:10px;bottom:10px;width:min(760px,calc(100vw - 20px));z-index:41;background:var(--bg);border-radius:20px;
  box-shadow:var(--shadow-lg);transform:translateX(calc(100% + 20px));transition:transform .38s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;overflow:hidden}
.sheet{visibility:hidden;transition:transform .38s cubic-bezier(.2,.9,.2,1),visibility 0s linear .38s}
