<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pineapple 控制台</title>
<style>
/* ================================================================
   设计语言：Apple 健康 / 健身 / 屏幕使用时间那一路 ——
   · 大数字用圆体（ui-rounded），标签安静；一张卡回答一个问题。
   · 颜色跟着「人」走（每个码一个固定色，全页一致），不跟排名走；
     分类色 = dataviz 参考调色板（已跑 validate_palette，深浅两套）。
   · 状态色（绿 / 橙 / 红）只给状态，不拿来当系列色。
   · 环 = 今天 vs 平时日均（同 Apple 健身：超过 100% 会绕第二圈）。
   ================================================================ */
:root{
  --bg:#f5f5f7; --card:#fff; --card2:#fbfbfd; --soft:#f5f5f7; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.07);
  --sep:rgba(60,60,67,.13); --sep2:rgba(60,60,67,.07);
  --ink:#1d1d1f; --ink2:rgba(60,60,67,.68); --ink3:rgba(60,60,67,.40);
  --blue:#0071e3; --green:#1f8a3b; --green-d:#30c75a; --orange:#c25400; --orange-d:#ff9500; --red:#d70015; --red-d:#ff3b30;
  /* 分类色（dataviz 参考调色板，浅色档） */
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --cx:#a1a1a6;
  /* 三个环（健身环的色相，按底色调过明度） */
  --r1:#e6094a; --r2:#4fa800; --r3:#00a3b4;
  --seq:#2a78d6;
  --tint:rgba(0,113,227,.09); --ring:rgba(0,113,227,.25);
  --warn-bg:rgba(255,149,0,.13); --bad-bg:rgba(255,59,48,.10); --ok-bg:rgba(52,199,89,.13);
  --glass:rgba(245,245,247,.78);
  --shadow:0 .5px 0 rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.03);
  --shadow-lg:0 22px 70px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.06);
  --tip:rgba(29,29,31,.94); --tip-ink:#fff;
  --r:22px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0b0b0c; --card:#1c1c1e; --card2:#232325; --soft:#2c2c2e; --fill:rgba(120,120,128,.26); --fill2:rgba(120,120,128,.15);
  --sep:rgba(84,84,88,.6); --sep2:rgba(84,84,88,.34);
  --ink:#f5f5f7; --ink2:rgba(235,235,245,.64); --ink3:rgba(235,235,245,.34);
  --blue:#0a84ff; --green:#30d158; --green-d:#30d158; --orange:#ff9f0a; --orange-d:#ff9f0a; --red:#ff453a; --red-d:#ff453a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767; --cx:#636366;
  --r1:#fa114f; --r2:#92e82a; --r3:#1eeaef;
  --seq:#3987e5;
  --tint:rgba(10,132,255,.17); --ring:rgba(10,132,255,.38);
  --warn-bg:rgba(255,159,10,.16); --bad-bg:rgba(255,69,58,.17); --ok-bg:rgba(48,209,88,.15);
  --glass:rgba(11,11,12,.72);
  --shadow:0 0 0 .5px rgba(255,255,255,.06);
  --shadow-lg:0 22px 70px rgba(0,0,0,.66),0 0 0 .5px rgba(255,255,255,.09);
  --tip:rgba(58,58,60,.97); --tip-ink:#fff;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --card:#1c1c1e; --card2:#232325; --soft:#2c2c2e; --fill:rgba(120,120,128,.26); --fill2:rgba(120,120,128,.15);
  --sep:rgba(84,84,88,.6); --sep2:rgba(84,84,88,.34);
  --ink:#f5f5f7; --ink2:rgba(235,235,245,.64); --ink3:rgba(235,235,245,.34);
  --blue:#0a84ff; --green:#30d158; --green-d:#30d158; --orange:#ff9f0a; --orange-d:#ff9f0a; --red:#ff453a; --red-d:#ff453a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767; --cx:#636366;
  --r1:#fa114f; --r2:#92e82a; --r3:#1eeaef;
  --seq:#3987e5;
  --tint:rgba(10,132,255,.17); --ring:rgba(10,132,255,.38);
  --warn-bg:rgba(255,159,10,.16); --bad-bg:rgba(255,69,58,.17); --ok-bg:rgba(48,209,88,.15);
  --glass:rgba(11,11,12,.72);
  --shadow:0 0 0 .5px rgba(255,255,255,.06);
  --shadow-lg:0 22px 70px rgba(0,0,0,.66),0 0 0 .5px rgba(255,255,255,.09);
  --tip:rgba(58,58,60,.97); --tip-ink:#fff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
.mono{font-family:var(--mono);font-size:.92em}
.mut{color:var(--ink2)} .mut3{color:var(--ink3)}
.ok-t{color:var(--green)} .warn-t{color:var(--orange)} .bad-t{color:var(--red)}
.rnd{font-family:var(--round)}
::selection{background:var(--ring)}

/* ---------- 外框 ---------- */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 12px 16px;display:flex;flex-direction:column;gap:1px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);
  border-right:.5px solid var(--sep);z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 20px}
.brand .logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(165deg,#ffe066,#ffb300 55%,#ff9500);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08)}
.brand b{font-size:15px;font-weight:650;letter-spacing:-.02em;display:block;line-height:1.2}
.brand small{font-size:11.5px;color:var(--ink2)}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;border:0;background:none;
  color:var(--ink);cursor:pointer;width:100%;text-align:left;font-size:13.5px;transition:background .15s}
.nav:hover{background:var(--fill2)}
.nav svg{width:18px;height:18px;flex:none;color:var(--ink2)}
.nav .badge{margin-left:auto;min-width:18px;height:18px;padding:0 6px;border-radius:9px;font-size:11px;font-weight:600;
  display:grid;place-items:center;background:var(--fill);color:var(--ink2)}
.nav .badge.bad{background:var(--red-d);color:#fff} .nav .badge.warn{background:var(--orange-d);color:#fff}
.nav[aria-current="page"]{background:var(--fill);font-weight:600}
.nav[aria-current="page"] svg{color:var(--blue)}
.side .grow{flex:1}
.side-foot{padding:10px;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--ink2)}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green-d);margin-right:6px;vertical-align:1px;animation:pulse 2.4s infinite}
.live-dot.off{background:var(--ink3);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(48,199,90,.5)}70%{box-shadow:0 0 0 7px rgba(48,199,90,0)}100%{box-shadow:0 0 0 0 rgba(48,199,90,0)}}

main{min-width:0;padding:0 32px 64px;max-width:1480px}
.toolbar{position:sticky;top:0;z-index:15;margin:0 -32px 18px;padding:18px 32px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);
  border-bottom:.5px solid transparent;transition:border-color .2s}
.toolbar.scrolled{border-bottom-color:var(--sep)}
.toolbar h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.toolbar .sp{flex:1}
.status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);white-space:nowrap;cursor:default}
.status b{color:var(--ink);font-weight:600}
.status .sep{width:3px;height:3px;border-radius:50%;background:var(--ink3);margin:0 4px}
.status .bad-t b,.status .bad-t{color:var(--red)}
.status .warn-t b,.status .warn-t{color:var(--orange)}

.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--fill);gap:2px}
.seg button{border:0;background:none;padding:4px 13px;border-radius:7px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--ink);min-height:26px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 14px;border-radius:15px;border:0;
  background:var(--fill);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;transition:filter .15s,transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(.96)} .btn:active{transform:scale(.97)}
.btn.pri{background:var(--blue);color:#fff}
.btn.danger{background:var(--bad-bg);color:var(--red)}
.btn.plain{background:none;color:var(--blue);padding:0 6px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:15px;height:15px}
.icbtn{width:30px;height:30px;padding:0;border-radius:15px;display:inline-grid;place-items:center;border:0;background:var(--fill2);color:var(--ink2);cursor:pointer;flex:none}
.icbtn:hover{background:var(--fill);color:var(--ink)}
.icbtn svg{width:15px;height:15px}
.icbtn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 版式 ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;min-width:0;position:relative}
.anim .card{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.anim .grid>.card:nth-child(2){animation-delay:40ms}.anim .grid>.card:nth-child(3){animation-delay:80ms}.anim .grid>.card:nth-child(4){animation-delay:120ms}
.anim .grid>.card:nth-child(5){animation-delay:160ms}.anim .grid>.card:nth-child(n+6){animation-delay:200ms}
@keyframes fadein{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card.flush{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:16px;min-height:22px}
.card.flush .ch{padding:18px 22px 0;margin-bottom:12px}
.ch h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.015em}
.ch .sub{font-size:12px;color:var(--ink3)}
.ch .sp{flex:1}
.age{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.ch .icbtn{width:24px;height:24px;background:none;opacity:.0;transition:opacity .15s} .ch .icbtn svg{width:13px;height:13px}
.card:hover .ch .icbtn,.ch .icbtn.spin{opacity:1}
.sec{display:flex;align-items:baseline;gap:10px;margin:34px 2px 12px}
.sec h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.025em}
.sec span{font-size:12.5px;color:var(--ink3)}
.sec .sp{flex:1}
.sec-t{font-size:12.5px;font-weight:600;color:var(--ink2);margin:26px 2px 10px}

/* 大数字 */
.big{font-family:var(--round);font-weight:600;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.big small{font-family:var(--font);font-size:.42em;font-weight:500;color:var(--ink2);letter-spacing:0;margin-left:3px}
.lbl{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.lbl i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* KPI 带（一张卡里用发丝线分隔） */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:18px 22px 18px;border-left:.5px solid var(--sep2);min-width:0;position:relative}
.kpi:first-child{border-left:0}
.kpi .v{font-family:var(--round);font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:8px 0 6px;white-space:nowrap}
.kpi .v small{font-family:var(--font);font-size:14px;font-weight:500;color:var(--ink2);margin-left:3px}
.kpi .d{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;min-height:17px}
.kpi .d .up{color:var(--ink)} .kpi .d .bad{color:var(--red)} .kpi .d .good{color:var(--green)}
.kpi .spark{position:absolute;right:20px;bottom:18px;width:84px;height:30px}

/* 今天（hero） */
.hero{padding:26px 28px 22px}
.hero-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
.hero h2{margin:0 0 6px;font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.25}
.hero .say{font-size:14px;color:var(--ink2);max-width:62ch}
.hero .nums{display:flex;gap:40px;margin-top:22px;flex-wrap:wrap}
.hero .nums .big{font-size:40px;margin-top:6px}
.rings{display:flex;align-items:center;gap:22px}
.rings svg{display:block;flex:none}
.rings .rl{display:flex;flex-direction:column;gap:12px;font-size:12px;color:var(--ink2);min-width:120px}
.rings .rl b{display:block;font-family:var(--round);font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.rings .rl div{display:flex;flex-direction:column}
.ring-arc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.hero .swim{margin-top:24px;padding-top:18px;border-top:.5px solid var(--sep2)}

/* 泳道（屏幕使用时间那种：一人一行，一天里的上课块） */
.swim .sl{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;align-items:center;gap:12px;height:30px}
.swim .sl .who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.swim .sl .who i{width:8px;height:8px;border-radius:50%;flex:none}
.swim .sl .tot{font-size:12px;color:var(--ink2);text-align:right;font-family:var(--round)}
.swim .track{position:relative;height:16px;border-radius:5px;background:var(--fill2)}
.swim .track b{position:absolute;top:0;bottom:0;border-radius:4px;min-width:2px}
.anim .swim .track b{animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
.swim .axis{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:12px;margin-top:6px}
.swim .axis .ax{position:relative;height:14px;font-size:10.5px;color:var(--ink3)}
.swim .axis .ax span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.swim .now{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--red-d);border-radius:1px}

/* 日历热图 */
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.cal i{display:block;aspect-ratio:1;border-radius:5px;background:var(--fill2);position:relative}
.cal i.today{box-shadow:0 0 0 1.5px var(--ink)}
.cal i.pad{background:none}
.anim .cal i{animation:fadein .5s ease both}
.calw{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px}
.calw .wd{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-size:10.5px;color:var(--ink3);align-items:center}
.scale{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink3)}
.scale i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* 列表 */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 22px;border-top:.5px solid var(--sep2);min-height:50px;cursor:default;position:relative}
.row:first-child{border-top:0}
.row.click{cursor:pointer;transition:background .12s}
.row.click:hover{background:var(--fill2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-size:13px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink3)}
.dot.ok{background:var(--green-d)} .dot.warn{background:var(--orange-d)} .dot.bad{background:var(--red-d)} .dot.live{background:var(--green-d);animation:pulse 2.4s infinite} .dot.blue{background:var(--blue)}

.chip{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:500;background:var(--fill2);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--green)} .chip.warn{background:var(--warn-bg);color:var(--orange)} .chip.bad{background:var(--bad-bg);color:var(--red)} .chip.blue{background:var(--tint);color:var(--blue)}
.chips{display:flex;gap:5px;flex-wrap:wrap}

/* 表格 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:500;color:var(--ink3);text-align:left;padding:8px 12px;border-bottom:.5px solid var(--sep);white-space:nowrap;background:var(--card)}
td{padding:10px 12px;border-bottom:.5px solid var(--sep2);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--fill2)}
td.wrap{white-space:normal;min-width:160px}
th:first-child,td:first-child{padding-left:22px} th:last-child,td:last-child{padding-right:22px}

/* 份额条 */
.bar{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--blue);transform-origin:left}
.anim .bar i,.anim .stack i{animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.bar.thin{height:4px}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%;transform-origin:left;min-width:2px}
.meter{display:flex;flex-direction:column;gap:7px}
.meter .top{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}
.meter .top b{font-weight:600}

/* 状态 */
.err{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--bad-bg);color:var(--red);font-size:13px}
.err svg{width:16px;height:16px;flex:none;margin-top:1px}
.err .btn{margin-left:auto;height:26px;font-size:12px}
.empty{padding:28px 10px;text-align:center;color:var(--ink2);font-size:13px}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:3px;font-size:14px}
.sk-line{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--fill2) 0%,var(--fill) 50%,var(--fill2) 100%);background-size:200% 100%;animation:shimmer 1.3s infinite;margin:10px 0}
.sk-blk{border-radius:14px;background:linear-gradient(90deg,var(--fill2) 0%,var(--fill) 50%,var(--fill2) 100%);background-size:200% 100%;animation:shimmer 1.3s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* 提醒 */
.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 12px;padding:13px 22px;border-top:.5px solid var(--sep2);align-items:start}
.alert:first-child{border-top:0}
.alert .ai{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;grid-row:1/3}
.alert .ai svg{width:15px;height:15px}
.alert.bad .ai{background:var(--bad-bg);color:var(--red)} .alert.warn .ai{background:var(--warn-bg);color:var(--orange)} .alert.ok .ai{background:var(--ok-bg);color:var(--green)}
.alert .at{font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.alert .ad{grid-column:2/4;font-size:12.5px;color:var(--ink2)}
.alert .aw{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.alert .ack{opacity:0;transition:opacity .15s}
.alert:hover .ack{opacity:1}
.must{background:linear-gradient(180deg,var(--bad-bg),transparent 140%),var(--card)}

/* 图表 */
.chart{position:relative;width:100%;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font:11px var(--font);fill:var(--ink3);font-variant-numeric:tabular-nums}
.chart .grid-l{stroke:var(--sep2);stroke-width:1}
.chart .base-l{stroke:var(--sep);stroke-width:1}
.chart .hl{stroke:var(--ink3);stroke-width:1}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--tip);color:var(--tip-ink);border-radius:12px;padding:9px 12px;
  font-size:12px;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.24);max-width:340px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#tip.on{opacity:1;transform:none}
#tip .tv{font-family:var(--round);font-size:17px;font-weight:600;letter-spacing:-.01em}
#tip .tl{color:rgba(255,255,255,.6)}
#tip .tr{display:flex;gap:14px;align-items:center;justify-content:space-between}
#tip .tr i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
#tip pre{margin:0;font:11px/1.4 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:hidden}

/* 人 */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.pc{cursor:pointer;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;overflow:hidden}
.pc:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.pc .top{display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:650;font-size:15px;flex:none;letter-spacing:-.02em;font-family:var(--round)}
.pc .nm{font-weight:650;font-size:16px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .meta{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .mid{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:14px;align-items:end;margin:18px 0 14px}
.pc .mid .big{font-size:30px}
.pc .foot2{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2);padding-top:12px;border-top:.5px solid var(--sep2)}
.seats{display:inline-flex;gap:4px;vertical-align:middle;align-items:center}
.seats svg{width:16px;height:16px}
.seats .on{color:var(--ink)} .seats .off{color:var(--ink3);opacity:.5}
.seats.full .on{color:var(--orange)}

/* 网页课：近 2 天的甘特 */
.gantt .gl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;align-items:center;height:28px}
.gantt .gl .who{font-size:12.5px;font-weight:500;display:flex;gap:8px;align-items:center;overflow:hidden;white-space:nowrap}
.gantt .gl .who i{width:8px;height:8px;border-radius:50%;flex:none}
.gantt .track{position:relative;height:14px}
.gantt .track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--sep2)}
.gantt .track b{position:absolute;top:0;bottom:0;border-radius:4px;min-width:5px;cursor:pointer;transition:filter .15s}
.gantt .track b:hover{filter:brightness(1.15)}
.gantt .track b.bad{background:var(--red-d)!important} .gantt .track b.warn{background:var(--orange-d)!important}
.gantt .days{position:relative;height:16px;font-size:10.5px;color:var(--ink3);margin-left:102px}
.gantt .days span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.gantt .days span.d0{font-weight:600;color:var(--ink2)}

/* 网页课详情：多轨时间线（Instruments 那种） */
.tracks{display:grid;grid-template-columns:78px minmax(0,1fr);gap:0 12px;align-items:center}
.tracks .tn{font-size:11.5px;color:var(--ink2);text-align:right;line-height:1.2}
.tracks .tn small{display:block;color:var(--ink3);font-size:10.5px}
.tracks .tk{border-top:.5px solid var(--sep2)}
.tracks .tn.f,.tracks .tk.f{border-top:0}

/* 面板（Sheet） */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.24);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:10px;right:10px;bottom:10px;width:min(800px,calc(100vw - 20px));z-index:41;background:var(--bg);border-radius:24px;
  box-shadow:var(--shadow-lg);transform:translateX(calc(100% + 20px));display:flex;flex-direction:column;overflow:hidden;
  visibility:hidden;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s linear .42s}
.sheet.on{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s}
.sheet .sh{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:.5px solid var(--sep);background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.sheet .sh h2{margin:0;font-size:18px;font-weight:650;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .sb{flex:1;overflow:auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:14px}
.sheet .card{animation:none}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px 18px}
.kv div{font-size:11.5px;color:var(--ink2);min-width:0}
.kv b{display:block;font-family:var(--round);font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.kv b.sm{font-family:var(--font);font-size:13px;font-weight:500}
.checks{display:flex;flex-direction:column;gap:10px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45}
.ck>i{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--font);font-style:normal;color:#fff;margin-top:1px}
.ck.ok>i{background:var(--green-d)}.ck.warn>i{background:var(--orange)}.ck.bad>i{background:var(--red)}
.ck .s{font-size:12px;color:var(--ink3);margin-top:2px}
details.more{margin-top:16px}
details.more>summary{cursor:pointer;font-size:12.5px;color:var(--ink2);list-style:none;display:inline-flex;align-items:center;gap:6px;user-select:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
details.more[open]>summary::before{transform:rotate(45deg)}
details.card.more{margin-top:0}
details.card.more>summary{font-size:14px;font-weight:600;color:var(--ink)}
.kv.dense{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 18px}
.kv.dense b{font-size:13.5px;font-family:var(--font);font-weight:500}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink2)}
.field input,.field select,.inp{height:34px;border-radius:9px;border:.5px solid var(--sep);background:var(--soft);padding:0 11px;font-size:13.5px;outline:none;min-width:0;width:100%}
.field input:focus,.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--ring)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.codebox{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--soft)}
.codebox code{flex:1;font:13.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em}
.ev{font:12px/1.5 var(--mono);padding:6px 22px;border-top:.5px solid var(--sep2);display:grid;grid-template-columns:62px 96px 1fr;gap:10px;cursor:default}
.ev:hover{background:var(--fill2)}
.ev.bad{color:var(--red)}
.ev .x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.ev.bad .x{color:inherit}
.pshead{display:flex;align-items:center;gap:16px}
.pshead .nm{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15}

/* 弹窗 */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.28);animation:fade .15s both;padding:16px}
@keyframes fade{from{opacity:0}}
.dlg{width:min(390px,100%);background:var(--card);border-radius:18px;box-shadow:var(--shadow-lg);padding:22px 22px 18px;animation:pop .22s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.dlg h4{margin:0 0 6px;font-size:16px;font-weight:650}
.dlg p{margin:0 0 14px;font-size:13px;color:var(--ink2);white-space:pre-line}
.dlg .actions{justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:70;background:var(--tip);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;box-shadow:var(--shadow-lg);animation:pop .2s both}

.foot{margin:40px 4px 0;font-size:11.5px;color:var(--ink3);line-height:1.6;max-width:760px}
.hide{display:none!important}

/* ---------- 响应式 ---------- */
@media (max-width:1180px){ .s3{grid-column:span 6} .s4,.s5,.s7,.s8,.s6{grid-column:span 12} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi:nth-child(3){border-left:0} .kpi:nth-child(n+3){border-top:.5px solid var(--sep2)} }
@media (max-width:900px){ .hero-top{grid-template-columns:minmax(0,1fr)} .rings{justify-content:flex-start} }
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:.5px solid var(--sep);justify-content:space-around}
  .brand,.side .grow,.side-foot{display:none}
  #navs{display:contents}
  .ch{flex-wrap:wrap}
  .ch .seg{width:100%;overflow-x:auto}
  .ch .seg button{flex:1}
  .ch .icbtn{opacity:1}
  .nav{flex-direction:column;gap:2px;padding:5px 2px;font-size:10px;width:auto;flex:1;align-items:center;background:none!important;box-shadow:none!important;color:var(--ink3);position:relative;font-weight:500!important}
  .nav svg{width:22px;height:22px;color:inherit!important}
  .nav[aria-current="page"]{color:var(--blue)}
  .nav .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0;min-width:16px;height:16px;font-size:10px;padding:0 4px}
  main{padding:0 16px 96px}
  .toolbar{margin:0 -16px 12px;padding:12px 16px 10px;gap:10px}
  .toolbar h1{font-size:24px}
  .status{order:5;width:100%;overflow:hidden}
  .grid{gap:12px}
  .card{padding:16px 16px;border-radius:20px}
  .card.flush .ch{padding:16px 16px 0}
  .hero{padding:20px 16px}
  .hero h2{font-size:20px}
  .hero .nums{gap:22px}
  .hero .nums .big{font-size:32px}
  .rings svg{width:120px;height:120px}
  .swim .sl,.swim .axis{grid-template-columns:72px minmax(0,1fr) 46px;gap:8px}
  .gantt .gl{grid-template-columns:64px minmax(0,1fr)} .gantt .days{margin-left:76px}
  .kpi{padding:14px 16px} .kpi .v{font-size:25px} .kpi .spark{display:none}
  .people{grid-template-columns:minmax(0,1fr)}
  .sheet{top:auto;left:0;right:0;bottom:0;width:100%;height:92vh;border-radius:22px 22px 0 0;transform:translateY(100%)}
  .row{padding:11px 16px} .alert{padding:12px 16px}
  th:first-child,td:first-child{padding-left:16px} th:last-child,td:last-child{padding-right:16px}
  .ev{grid-template-columns:54px 80px 1fr;padding:6px 16px}
  .tracks{grid-template-columns:56px minmax(0,1fr);gap:0 8px}
  .sec{margin:26px 2px 10px} .sec h2{font-size:19px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} .draw{stroke-dasharray:none;stroke-dashoffset:0} }
</style>

<body>
<div class="app">
  <nav class="side" id="side" aria-label="主导航">
    <div class="brand">
      <div class="logo"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 7.2c-3.5 0-5.8 3-5.8 6.9S8.5 21 12 21s5.8-3 5.8-6.9-2.3-6.9-5.8-6.9Z" fill="#fff" opacity=".96"/><path d="M12 7.2c0-2 1-3.6 3-4.5M12 7.2c0-1.8-.8-3.3-2.6-4.2M12 7.2c-.3-1.4.2-2.7 1.2-3.6" stroke="#2c7a2f" stroke-width="1.6" stroke-linecap="round"/><path d="M9 12.2l3 2.4 3-2.4M9 16.2l3 2.4 3-2.4" stroke="#ff9f0a" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><b>Pineapple</b><small>通行码管理 · 本机</small></div>
    </div>
    <div id="navs"></div>
    <div class="grow"></div>
    <div class="side-foot">
      <div class="seg" id="theme" role="group" aria-label="外观">
        <button type="button" data-v="auto">自动</button><button type="button" data-v="light">浅色</button><button type="button" data-v="dark">深色</button>
      </div>
      <div><span class="live-dot" id="livedot"></span><span id="livetxt">自动刷新中</span></div>
    </div>
  </nav>
  <main>
    <div class="toolbar" id="toolbar">
      <h1 id="title">概览</h1>
      <div class="status" id="status" aria-live="polite"></div>
      <span class="sp"></span>
      <div class="seg" id="range" role="group" aria-label="时间范围">
        <button type="button" data-v="1">今天</button><button type="button" data-v="7">7 天</button><button type="button" data-v="0">全部</button>

      「一天」按 UTC 算（北京时间早上 8 点换日）；页面上的时刻都是你这边的时间，每个人的上课习惯按他那边的时间。「一般」= 一半情况比这快，「慢的时候」= 最慢的那 5%～10%。</p>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-modal="true" role="dialog" aria-labelledby="shtitle">

  <div class="sb" id="shbody"></div>
</aside>
<div id="tip" role="tooltip"></div>
<script>
/* >>>CLUI-COST-START<<< */
/* 判据从这两个哨兵之间抠出源码，喂给 node 跑（tests/test_cl_admin_ui.py）。
   改这里不用改测试。但要保持它是纯函数：不读 state、不碰 DOM，价目表整个从参数进来。 */
function cluiCost(u, p){
  var hit = Math.min(u.cache_hit || 0, u.tokens_in || 0), miss = Math.max(0, (u.tokens_in || 0) - hit);
  return (hit * p.cache + miss * p.miss + (u.tokens_out || 0) * p.out) / 1e6;
}
/* >>>CLUI-COST-END<<< */

/* >>>CLUI-DEP-START<<< */
/* 部署时间轴的**算术**（画的部分在外面）。判据从这两个哨兵之间抠出源码喂 node 跑
   （tests/test_cl_admin_ui.py）。要纯函数：不读 state、不碰 DOM、不依赖别的函数。
   `vs` = cf_health 的 `versions`；`t0`/`t1` = 窗口两端（毫秒）。
   段起点优先用 `deployed_at`（`wrangler deploy` 的权威时刻）；读不到就退回 `first`
   （窗口里第一次有请求的分钟）并把 `known` 置 false —— 调用方据此在界面上如实标出来，
   **不许**拿第二次的当第一次的报。返回按时间排好的段：
   `s`/`e` 已钳进窗口、`dur` = `e - s`、`at` 真实部署时刻（不知道 = null）、
   `live` = 最后一个（到窗口末尾还活着的那一版；按定义有且只有一个）。

   ⚠️ **必须自己按时间重排**：上游 `versions` 是按 `first`（第一次有请求的分钟）排的，
   那顺序可能跟部署顺序**不一样** —— 低流量的版本可能上线几小时后才来第一个请求。
   照搬上游顺序会把段画到错的位置，而且接缝是断的。
   ⚠️ 不变量：`s <= e`、首段 `s >= t0`、末段 `e == t1`、段与段首尾相接。
   所以这里不钳 `dur`（钳了就是判据够不着的死代码）。 */
function cluiDepSegs(vs, t0, t1){
  var rows = [];
  (vs || []).forEach(function(v){
    var at = v.deployed_at ? Date.parse(v.deployed_at) : NaN;
    if(!isNaN(at) && at >= t1) return;                       // 窗口末尾及之后才上的版本不画（真的会漏进来）
    var fb = Date.parse(v.first);
    rows.push({id: v.id, requests: v.requests || 0,
               at: isNaN(at) ? null : at, known: !isNaN(at),
               s: Math.max(t0, isNaN(at) ? (isNaN(fb) ? t0 : fb) : at)});
  });
  rows.sort(function(a, b){ return a.s - b.s; });            // 稳的：同起点的保持原顺序
  rows.forEach(function(r, k){
    r.i = k + 1;
    r.e = k + 1 < rows.length ? Math.min(t1, rows[k + 1].s) : t1;
    r.dur = r.e - r.s;
    r.live = k === rows.length - 1;
  });
  return rows;
}
/* >>>CLUI-DEP-END<<< */

/* ================================================================
   时刻（判据 TzCase 抠这几段真源码跑：hm / ago / agoIn / hmIn / tzOf / tzLabel / whenIn + TZ_NAME）
   ================================================================ */
var state = {habits: undefined};
function hm(ms){ var t = new Date(ms); return String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0"); }
function ago(ms){      /* 本机时区，**永远精确到分钟**：「今天 13:17 / 昨天 22:05 / 10-12 09:06」 */
  if(!ms) return "无";
  var t = new Date(ms), now = new Date();
  var d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if(ms >= d0) return "今天 " + hm(ms);
  if(ms >= d0 - 86400000) return "昨天 " + hm(ms);
  return String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0") + " " + hm(ms);
}
var TZ_NAME = {"Europe/Dublin":"爱尔兰时间","Europe/London":"英国时间","Asia/Shanghai":"北京时间","Asia/Hong_Kong":"香港时间",
  "America/Los_Angeles":"太平洋时间","America/Denver":"山地时间","America/Chicago":"中部时间","America/New_York":"美东时间",
  "America/Toronto":"多伦多时间","America/Vancouver":"温哥华时间","Asia/Tokyo":"日本时间","Asia/Seoul":"韩国时间",
  "Asia/Singapore":"新加坡时间","Asia/Taipei":"台北时间","Asia/Macau":"澳门时间","Australia/Sydney":"悉尼时间",
