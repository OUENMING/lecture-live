# ClassLive 定稿 ASR 代理：Groq 优先、千问免费额度兜底。
#
# 部署（主会话在 Owen 点头后做）：
#   cd server/asr-worker
#   wrangler secret put GROQ_KEY          # < ~/.classlive/groq-token，管道灌入不回显
#   wrangler secret put QWEN_KEY          # 百炼国际站（新加坡）key；< ~/.classlive/ 下对应 token 文件，管道灌入不回显
#   wrangler secret put CLIENT_TOKEN      # 新生成，值与客户端 asr_endpoint.py 一致（公开令牌）
#   wrangler secret put DEEPSEEK_KEY      # < ~/.classlive/credentials（一人一码：通行码用户的翻译走它；
#                                         #   管道灌入不回显。⚠️ 不写这个写法就会被问「怎么没让我输 key」——2026-10-12）
#   wrangler secret put ADMIN_TOKEN       # 一人一码：/v1/admin/* 只认它（scripts/cl_admin.py 读 ~/.classlive/asr-admin-token）
#   wrangler secret put SONIOX_KEY        # 实时转写的临时 key 由它签发（美国区项目）。⚠️ 这把主 key 的权限要有
#                                         #   **Temporary API keys** + Speech-to-Text；临时 key 才下发，主 key 不出 Worker。
#   wrangler secret put SONIOX_KEY_JP     # 可选：日本区项目的 key（CN/HK/MO/TW/JP/KR 访客 + 亚洲/大洋洲访客走 api.jp.*）。
#                                         #   不配 = 这些访客全走美国区。
#   wrangler secret put SONIOX_KEY_EU     # 可选：欧盟区项目的 key（欧洲/非洲访客走 api.eu.*）。不配 = 走美国区。
#                                         #   两个可选 key 都不配，代码不需要改 —— 全走美国（fail-safe）。
#   wrangler secret put JEV_KEY           # 可选：Jev 官方 key（非中国区默认走它）
#   wrangler secret put JEV_CC_KEY        # 可选：CommandCode key —— Jev 中国区默认走它（2026-11-04）
#   wrangler secret put CMD_CHAT_KEY      # 可选：CommandCode key，**长调用主通道**（课后笔记 / 实时总结，
#                                         #   2026-11-05）。不配就复用 JEV_CC_KEY；两把都不配 = 长调用全走 DeepSeek。
#                                         #   ⚠️ 建议单独配一把：笔记量大，和 Jev 共用会把 Jev 额度一起打满。
#   wrangler secret put OPENCODE_GO_KEY   # 可选：OpenCode Go 的 key（第三家上游，2026-11-17）。只有路由表把某个
#                                         #   调用类指到 opencode 时才用；不配 = 那一类静默回 DeepSeek（fail-safe）。
#                                         # ⚠️ 它要的是 zen/go/v1 那把 key，不是本地 `opencode` CLI 的登录态。
#   OPENCODE_GO_MODEL                     # 可选（普通变量即可，`wrangler secret put` 也行）：不写就是
#                                         #   `deepseek-v4.1-flash`（2026-11-17 实查 /zen/go/v1/models 有这个 id）。
#   CHAT_ROUTES                           # 可选：不带 DO 表时的上游路由（`chapter=deepseek,note=cc,*=deepseek`）。
#                                         #   **只在没写 DO 表时才看得出**：`cl_admin.py route …` 写进 DO 的那张表优先级更高。
#   ROUTE_OVERRIDE_PASSES（可选，默认 "test1"）：哪些码名能用 X-ClassLive-Route 单请求指定上游（A/B 用；逗号分隔）
#   wrangler deploy
#
# 实时转写的会话上限默认 3 h。要改就加一段 [vars]（可选，不写就用默认）：
#   [vars]
#   SONIOX_MAX_SESSION_S = "10800"        # 秒；官方上限 18000
#
# 网页版（web/）的 CORS 白名单（2026-11-17，docs/API-web-v0-20261117.md §8-2）：#   WEB_ORIGIN  = 网页版那**一个**来源（如 `https://<子域>`，带协议、不带结尾斜杠）。
#                 **不配 = 一个来源都不放行**（fail-closed）：`/v1/soniox/key`、`/v1/chat/completions`、
#                 `/v1/web/*` 的 OPTIONS 预检一律 404，也不会给任何响应加 CORS 头。
#                 ⚠️ 绝不用 `*`；`/v1/transcribe`、`/v1/jev`、`/v1/admin/*` 永远不加 CORS 头。
#                 两种配法任选：`wrangler secret put WEB_ORIGIN`（值不进仓库）或下面 [vars] 里写
#                 WEB_ORIGIN = "https://…"（值是公开的，写这里也行）。真实值不要写进本地文件。
#
# 网页版的日实时转写额度（2026-11-17，P4-b；Owen 定「默认每天 5 小时」）：
#   WEB_DAILY_RT_S = "18000"              # 秒，= 5 h。不写就是 18000。
#                                         # 配成 "none" = 网页**不限**（与桌面同）。
#                                         # 单个码可盖（优先级更高）：`cl_admin.py limit <名字> --web-rt-s <秒|none|default>`，
#                                         #   `default` / 不设 = 跟随这里的全局值。
#                                         # 写入 [vars] 即可（非 secret）。
#   ⚠️ 这是**软闸**：网页自己连 Soniox，Worker 看不到音频流，秒数靠每小时 Cron 从用量日志回收
#     （client_reference_id 后缀 `-web` 分账）；领临时 key 时会按「今天还剩多少」压 max_session_duration，
#     挡得住一天内反复领 key，但挡不住「刚开课还没记上账」的那一段。
#
# ⚠️ 与上传 Worker 分开：那个是「只写、PUT-only」的安全立场，转写放进去会改性质。
# ⚠️ 设计见 ../../docs/PLAN-r2-cloud-final-asr.md §W。

name = "classlive-asr"
main = "src/index.js"
compatibility_date = "2025-10-01"

# ⚠️⚠️ **必须写在任何 `[table]` / `[[table]]` 之前** —— TOML 里 `routes` 跟在表后面会被解析成
#     那张表的键（wrangler 只给一条 warning），路由根本没建（上传 Worker 2026-10-05 踩过）。
routes = [
  { pattern = "asr.bldcam.page", custom_domain = true }
]

# 额度状态：单实例 Durable Object。免费档只能 SQLite 后端 -> new_sqlite_classes。
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]

# 一人一码（docs/PLAN-passkey.md）：通行码表 / 设备 / 用量。单实例，同样只能 SQLite 后端。
[[durable_objects.bindings]]
name = "PASSES"
class_name = "Passes"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Passes"]

# 网页版会话账本（W12，docs/API-web-v0-20261117.md §5）：**每个通行码一个实例**，
# idFromName 用 sha256(通行码) 前 16 hex，**明文码不当 DO 名字**。元数据 / seq 水位 / 任务队列存在它的 SQLite 里。
[[durable_objects.bindings]]
name = "WEB_SESSIONS"
class_name = "WebSessions"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["WebSessions"]

# 术语上云（W19，docs/API-web-v0-20261117.md §3.9）：**每通行码一个实例**（idFromName(codeHash16)，
# 同 WebSessions 的分片方式）：`course:<课名>` = {text, updated_at}。
[[durable_objects.bindings]]
name = "WEB_TERMS"
class_name = "WebTerms"

# 同课共享池：**全局一个实例**（代码里固定用 idFromName("terms-pool-v1") 取），`share:<课号>:<hash>` = {text}。
# 要跨码汇总人数，所以不能按码分片；写入是读-改-写（覆盖贡献），要 DO 的串行 —— 不用 R2。
[[durable_objects.bindings]]
name = "WEB_TERMS_POOL"
class_name = "WebTermsPool"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["WebTerms", "WebTermsPool"]

# 按安装限流：30 次 / 60 s（每个 Cloudflare 节点各自计数）。
# ⚠️ Rate Limiting binding 需要 wrangler >= 4.36.0；period 只能是 10 或 60；
#    限流参数写在 [ratelimits.simple] 子表里（官方文档格式，同上传 Worker）。
[[ratelimits]]
name = "PER_INSTALL"
namespace_id = "2001"
  [ratelimits.simple]
  limit = 30
  period = 60

# R17：再按 IP 限一道（60 次 / 60 s）。令牌公开、install_id 可伪造，按 install 限流单独挡不住。
[[ratelimits]]
name = "PER_IP"
namespace_id = "2002"
  [ratelimits.simple]
  limit = 60
  period = 60

# 用量回收：实时转写的音频不进 Worker（客户端拿临时 key 直连 Soniox），所以每小时拉一次 Soniox 的
# 用量日志，把音频秒按码名补进 Passes 的 rt_s（见 handler.js 的 scheduled / passes-core 的 /admin/rt/*）。
# ⚠️ 免费档的 Cron 就是定时调这个 Worker 的 scheduled()，不额外收费；:17 起跑，避开整点。
[triggers]
crons = ["17 * * * *"]

# 网页版逐句文本（W12）：单独一个桶，**不复用上传桶**（上传桶里有真课的 report / transcript）。
# 键：`web/<码hash16>/sessions/<session_id>/lines-<起始seq>.json`；桶里不出现完整码、不出现名字段。
# ⚠️ **待 Owen 确认**：分桶 vs 与 `classlive-ingest` 同桶（契约 §6.1 留的两选）。
# ⚠️ 30 天生命周期在桶上配（Dashboard 不支持，要 CLI）：
#      `wrangler r2 bucket lifecycle add classlive-web web-expire-30 --expire-days 30 --prefix web/`
#      —— **未部署**，代码里不删任何对象（只靠 DELETE /v1/web/data 与桶规则）。
[[r2_buckets]]
binding = "WEB_DATA"
bucket_name = "classlive-web"

# 逐请求事件：handler.js 的 track() 每个非管理请求写一条（码名 + 数字，不写文本 / 音频 / IP / 完整码）。
# 保留 3 个月；免费档每天 10 万条写入、1 万次查询（2026-10-14 官方 pricing / limits 页）。
# 面板 scripts/cl_admin_ui.py 用只读 analytics token 打 SQL API 读。
[[analytics_engine_datasets]]
binding = "AE"
dataset = "classlive_events"

# 日志 / 追踪（2026-10-13 Owen 在控制台打开，这里同步；不写的话下次 wrangler deploy 会关回去）。
# console.log 只记通行码名字 / 拒绝原因 / 走的引擎 / 毫秒数，不记转写文本。
# ⚠️ invocation_logs 关掉（2026-10-14）：开着时 Cloudflare 给**每个请求**存一条元数据，实查含
#    cf-connecting-ip / x-real-ip、经纬度、邮编、城市、全部请求头（authorization 被打码成 ********）——
#    超出 PLAN-passkey §4「只记数字」。console.log 那几行自己的事件只带方法 / 路径，不受影响。
[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
