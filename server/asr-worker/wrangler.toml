# ClassLive 定稿 ASR 代理：Groq 优先、千问免费额度兜底。
#
# 部署（主会话在 Owen 点头后做）：
#   cd server/asr-worker
#   wrangler secret put GROQ_KEY          # < ~/.classlive/groq-token，管道灌入不回显
#   wrangler secret put QWEN_CN_KEY       # < ~/.classlive/qwen-cn-token
#   wrangler secret put CLIENT_TOKEN      # 新生成，值与客户端 asr_endpoint.py 一致（公开令牌）
#   wrangler deploy
#
# ⚠️ 与上传 Worker 分开：那个是「只写、PUT-only」的安全立场，转写放进去会改性质。
# ⚠️ 设计见 ../../docs/PLAN-r2-cloud-final-asr.md §W。

name = "classlive-asr"
main = "src/index.js"
compatibility_date = "2025-10-01"

# ⚠️⚠️ **必须写在任何 `[table]` / `[[table]]` 之前** —— TOML 里 `routes` 跟在表后面会被解析成
#     那张表的键（wrangler 只给一条 warning），路由根本没建（上传 Worker 2026-10-05 踩过）。
routes = [
  { pattern = "asr.bldcam.page", custom_domain = true }
]

# 额度状态：单实例 Durable Object。免费档只能 SQLite 后端 -> new_sqlite_classes。
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]

# 按安装限流：30 次 / 60 s（每个 Cloudflare 节点各自计数）。
# ⚠️ Rate Limiting binding 需要 wrangler >= 4.36.0；period 只能是 10 或 60；
#    限流参数写在 [ratelimits.simple] 子表里（官方文档格式，同上传 Worker）。
[[ratelimits]]
name = "PER_INSTALL"
namespace_id = "2001"
  [ratelimits.simple]
  limit = 30
  period = 60

# R17：再按 IP 限一道（60 次 / 60 s）。令牌公开、install_id 可伪造，按 install 限流单独挡不住。
[[ratelimits]]
name = "PER_IP"
namespace_id = "2002"
  [ratelimits.simple]
  limit = 60
  period = 60
