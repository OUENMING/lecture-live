# ClassLive 定稿 ASR 代理：Groq 优先、千问免费额度兜底。
#
# 部署（主会话在 Owen 点头后做）：
#   cd server/asr-worker
#   wrangler secret put GROQ_KEY          # < ~/.classlive/groq-token，管道灌入不回显
#   wrangler secret put QWEN_KEY          # 百炼国际站（新加坡）key；< ~/.classlive/ 下对应 token 文件，管道灌入不回显
#   wrangler secret put CLIENT_TOKEN      # 新生成，值与客户端 asr_endpoint.py 一致（公开令牌）
#   wrangler secret put DEEPSEEK_KEY      # < ~/.classlive/credentials（一人一码：通行码用户的翻译走它；
#                                         #   管道灌入不回显。⚠️ 不写这个写法就会被问「怎么没让我输 key」——2026-10-12）
#   wrangler secret put ADMIN_TOKEN       # 一人一码：/v1/admin/* 只认它（scripts/cl_admin.py 读 ~/.classlive/asr-admin-token）
#   wrangler secret put SONIOX_KEY        # 实时转写的临时 key 由它签发（美国区项目）。⚠️ 这把主 key 的权限要有
#                                         #   **Temporary API keys** + Speech-to-Text；临时 key 才下发，主 key 不出 Worker。
#   wrangler secret put SONIOX_KEY_JP     # 可选：日本区项目的 key（CN/HK/MO/TW/JP/KR 访客走 api.jp.*）。
#                                         #   不配 = 全走美国区，代码不需要改。
#   wrangler deploy
#
# 实时转写的会话上限默认 3 h。要改就加一段 [vars]（可选，不写就用默认）：
#   [vars]
#   SONIOX_MAX_SESSION_S = "10800"        # 秒；官方上限 18000
#
# ⚠️ 与上传 Worker 分开：那个是「只写、PUT-only」的安全立场，转写放进去会改性质。
# ⚠️ 设计见 ../../docs/PLAN-r2-cloud-final-asr.md §W。

name = "classlive-asr"
main = "src/index.js"
compatibility_date = "2025-10-01"

# ⚠️⚠️ **必须写在任何 `[table]` / `[[table]]` 之前** —— TOML 里 `routes` 跟在表后面会被解析成
#     那张表的键（wrangler 只给一条 warning），路由根本没建（上传 Worker 2026-10-05 踩过）。
routes = [
  { pattern = "asr.bldcam.page", custom_domain = true }
]

# 额度状态：单实例 Durable Object。免费档只能 SQLite 后端 -> new_sqlite_classes。
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]

# 一人一码（docs/PLAN-passkey.md）：通行码表 / 设备 / 用量。单实例，同样只能 SQLite 后端。
[[durable_objects.bindings]]
name = "PASSES"
class_name = "Passes"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Passes"]

# 按安装限流：30 次 / 60 s（每个 Cloudflare 节点各自计数）。
# ⚠️ Rate Limiting binding 需要 wrangler >= 4.36.0；period 只能是 10 或 60；
#    限流参数写在 [ratelimits.simple] 子表里（官方文档格式，同上传 Worker）。
[[ratelimits]]
name = "PER_INSTALL"
namespace_id = "2001"
  [ratelimits.simple]
  limit = 30
  period = 60

# R17：再按 IP 限一道（60 次 / 60 s）。令牌公开、install_id 可伪造，按 install 限流单独挡不住。
[[ratelimits]]
name = "PER_IP"
namespace_id = "2002"
  [ratelimits.simple]
  limit = 60
  period = 60

# 用量回收：实时转写的音频不进 Worker（客户端拿临时 key 直连 Soniox），所以每小时拉一次 Soniox 的
# 用量日志，把音频秒按码名补进 Passes 的 rt_s（见 handler.js 的 scheduled / passes-core 的 /admin/rt/*）。
# ⚠️ 免费档的 Cron 就是定时调这个 Worker 的 scheduled()，不额外收费；:17 起跑，避开整点。
[triggers]
crons = ["17 * * * *"]

# 逐请求事件：handler.js 的 track() 每个非管理请求写一条（码名 + 数字，不写文本 / 音频 / IP / 完整码）。
# 保留 3 个月；免费档每天 10 万条写入、1 万次查询（2026-10-14 官方 pricing / limits 页）。
# 面板 scripts/cl_admin_ui.py 用只读 analytics token 打 SQL API 读。
[[analytics_engine_datasets]]
binding = "AE"
dataset = "classlive_events"

# 日志 / 追踪（2026-10-13 Owen 在控制台打开，这里同步；不写的话下次 wrangler deploy 会关回去）。
# console.log 只记通行码名字 / 拒绝原因 / 走的引擎 / 毫秒数，不记转写文本。
# ⚠️ invocation_logs 关掉（2026-10-14）：开着时 Cloudflare 给**每个请求**存一条元数据，实查含
#    cf-connecting-ip / x-real-ip、经纬度、邮编、城市、全部请求头（authorization 被打码成 ********）——
#    超出 PLAN-passkey §4「只记数字」。console.log 那几行自己的事件只带方法 / 路径，不受影响。
[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
