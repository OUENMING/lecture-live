# class.bldcam.page —— ClassLive 网页版（纯静态 SPA）+ 接口反代
#
# 放 /etc/nginx/sites-available/，软链到 sites-enabled；证书路径按 certbot 默认。
# 前提：产物 `npm run build` 的 `build/` 已被 rsync 到 /home/ubuntu/classlive-web/releases/<UTC>，
#       `current` 是指向其中一版的软链（deploy/publish.sh 做的）。
#
# 默认不启用的两段（`location /v1/`、`location /soniox/`）已写好但注释掉：
# 现在网页直连 https://asr.bldcam.page 与 wss://stt-rt.soniox.com（CORS 已开）；
# 走同源反代是为了国内少一次跨域握手 + 让 Cookie/头更可控，等国内实测再开。

server {
	listen 80;
	listen [::]:80;
	server_name class.bldcam.page;

	# certbot 的 http-01 自己会插；其余一律跳 https
	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}
	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	# `http2` 写进 listen：Ubuntu 22.04/24.04 的 nginx（1.18 / 1.24）认这个写法；
	# 只在 nginx ≥ 1.25.1 会给一条 deprecation warning，不影响 reload。
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name class.bldcam.page;

	ssl_certificate     /etc/letsencrypt/live/class.bldcam.page/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/class.bldcam.page/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	root /home/ubuntu/classlive-web/current;
	index index.html;
	charset utf-8;

	# Cloudflare 灰云 → 直连本机，真实 IP 就是访客 IP；开了橙云再补 set_real_ip_from
	access_log /var/log/nginx/class.bldcam.page.access.log;
	error_log  /var/log/nginx/class.bldcam.page.error.log warn;

	# 静态资源：文件名带 hash（/_app/immutable/）与自托管识别核心（/vendor/），一年 immutable。
	# `add_header ... always` 只对 2xx/3xx 生效，404 不会被缓存成一年。
	location /_app/immutable/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location /vendor/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable";
		# 13 MB 的 wasm/zip：gzip 收益大（wasm 约 3.4 MB），但 gzip_static 没预压时别开太高的级别
		gzip on;
		gzip_types application/wasm application/javascript text/javascript application/json;
		gzip_comp_level 5;
		gzip_min_length 1024;
		# ⚠️ 在 location 里写 `types {}` 会整个替掉全局 mime.types，所以 .mjs/.js/.zip/.json 都显式列上：
		# 模块脚本的 MIME 不对，浏览器会直接拒执行 pyodide.mjs / pdf.min.mjs。
		types {
			application/wasm wasm;
			text/javascript mjs js;
			application/zip zip;
			application/json json;
		}
		default_type application/octet-stream;
		try_files $uri =404;
	}

	# 入口 HTML 永不缓存：发版后必须立刻拿到新的 /_app/ 指纹
	location = /index.html {
		add_header Cache-Control "no-cache, must-revalidate";
	}
	location = /200.html {
		add_header Cache-Control "no-cache, must-revalidate";
	}
	location ~* \.html$ {
		add_header Cache-Control "no-cache, must-revalidate";
		try_files $uri =404;
	}

	# —— 以下两段默认不启用：国内实测后再打开，同时把前端 VITE_API_BASE 改成同源 ——

	# 接口 Worker 反代（现在网页直连 https://asr.bldcam.page）
