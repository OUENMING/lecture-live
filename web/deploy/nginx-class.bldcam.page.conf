	# 	proxy_pass https://asr.bldcam.page;
	# 	proxy_ssl_server_name on;
	# 	proxy_set_header Host asr.bldcam.page;
	# 	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	# 	proxy_set_header X-Forwarded-Proto $scheme;
	# 	# 透传凭据与身份头（Worker 靠这几个认人和算账）
	# 	proxy_set_header Authorization $http_authorization;
	# 	proxy_set_header X-ClassLive-Install $http_x_classlive_install;
	# 	proxy_set_header X-ClassLive-Version $http_x_classlive_version;
	# 	proxy_set_header X-ClassLive-Client  $http_x_classlive_client;
	# 	proxy_set_header X-ClassLive-Call    $http_x_classlive_call;
	# 	proxy_set_header X-ClassLive-Tz      $http_x_classlive_tz;
	# 	# 流式翻译是 SSE：不缓冲，否则一句都到不了
	# 	proxy_buffering off;
	# 	proxy_cache off;
	# 	proxy_http_version 1.1;
	# 	proxy_set_header Connection "";
	# 	proxy_connect_timeout 10s;
	# 	proxy_send_timeout 300s;
	# 	proxy_read_timeout 300s;
	# }

	# Soniox 实时识别 WebSocket（现在网页直连 wss://stt-rt.soniox.com）
	# location /soniox/ {
	# 	proxy_pass https://stt-rt.soniox.com/;
	# 	proxy_ssl_server_name on;
	# 	proxy_set_header Host stt-rt.soniox.com;
	# 	proxy_http_version 1.1;
	# 	proxy_set_header Upgrade $http_upgrade;
	# 	proxy_set_header Connection "upgrade";
	# 	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	# 	proxy_read_timeout 3600s;
	# 	proxy_send_timeout 3600s;
	# 	proxy_buffering off;
	# }

	# SPA 回退：未预渲染的路由交给 200.html（adapter-static 的 fallback）
	location / {
		try_files $uri $uri/ /200.html;
	}
}
